<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FF8C42">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF8C42'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white'%3E听%3C/text%3E%3C/svg%3E">

<title>课后三表循环听写</title>
<link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon.png">
<style>
:root{
  --primary:#FF8C42; --primary-d:#E76F2E;
  --yellow:#FFF0D6; --blue:#D6ECFF; --green:#D4F5D9;
  --bg:#F7F8FA; --card:#ffffff; --ink:#2D3436; --sub:#8A9499;
  --red:#F56C6C; --amber:#FFC56E; --line:#E8ECEF;
  --r:16px;
  --tint:#FFF2E8;
  --tint-2:#FFE8D9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;background:linear-gradient(135deg,#FFA05C,#FF8C42);color:#fff;padding-top:calc(10px + env(safe-area-inset-top));}
.brand-wrap{display:flex;flex-direction:column;min-width:0;line-height:1.25;}
.brand{font-size:18px;font-weight:700;letter-spacing:1px;white-space:nowrap;}
.byline{color:#fff;font-size:11px;font-weight:600;letter-spacing:.5px;opacity:.85;white-space:nowrap;user-select:none;pointer-events:none;margin-top:1px;}
.kid-switch{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;max-width:52%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.kid-switch::-webkit-scrollbar{display:none;}
.kid-pill{position:relative;background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;}
.kid-pill.active{background:#fff;color:var(--primary-d);}
.kid-pill.add{background:rgba(255,255,255,.15);font-size:16px;line-height:1;padding:2px 9px;}
.kid-edit{position:absolute;top:-5px;right:-5px;width:15px;height:15px;line-height:15px;text-align:center;font-size:9px;border-radius:50%;background:#fff;color:var(--primary-d);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;user-select:none;}
.kid-edit:active{transform:scale(.88);}
.kid-pill.active .kid-edit{color:var(--primary);}

.tabs{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:19;display:flex;background:#fff;border-bottom:1px solid var(--line);}
.tab{flex:1;border:none;background:none;padding:10px 2px 8px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab.active{color:var(--primary-d);border-bottom-color:var(--primary);}
.tab-ico{width:20px;height:20px;}

#view{flex:1;padding:12px;}

.ver{display:inline-block;background:var(--primary);color:#fff;font-weight:700;padding:4px 12px;border-radius:999px;font-size:14px;box-shadow:0 2px 6px rgba(231,111,46,.3);}
.ver-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ver-wrap{display:flex;align-items:center;gap:6px;}
.ver-acts{display:flex;gap:8px;align-items:center;}
.qbtn{width:22px;height:22px;flex:none;border-radius:50%;border:none;background:#FFE3CD;color:#FF8C42;font-size:14px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.qbtn:active{transform:scale(.92);}
.ver-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--primary-d);box-shadow:0 1px 3px rgba(0,0,0,.05);}
.ver-btn.ghost{background:#EAF1F2;color:var(--ink);}
.ver-btn:active{transform:scale(.95);}
.bak-warn{background:#FFF3E0;border:1px solid #FFD9A8;color:#B26A00;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin:10px 0 2px;}
.bak-warn b{color:#C0392B;}
.hint{color:var(--sub);font-size:13px;margin:4px 2px 12px;line-height:1.5;}
.empty{color:var(--sub);text-align:center;padding:40px 16px;font-size:15px;}

/* 三表听写 */
.sem-row{background:var(--card);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.sem-name{font-weight:700;font-size:15px;margin-bottom:8px;}
.boxes{display:flex;gap:14px;}
.box{flex:1;border:none;border-radius:18px;padding:18px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:78px;justify-content:center;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);border:2px solid var(--tint-2);}
.box:active{transform:scale(.97);}
.box-t{font-weight:800;font-size:16px;color:#3F4A4E;}
.box.disabled{opacity:.4;}
.box.disabled .box-t{color:#9aa6ab;}
.gb-sem{font-weight:800;font-size:16px;color:var(--primary-d);margin-bottom:2px;}
.gb-sub{font-size:12px;color:var(--sub);}
.gb-tables{display:flex;flex-direction:row;gap:6px;width:100%;margin-top:8px;}
.gb-t{flex:1;border:none;border-radius:12px;padding:10px 4px;font-weight:800;font-size:14px;color:#3F4A4E;cursor:pointer;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform .12s;}
.gb-t:active{transform:scale(.93);}
.gb-t-empty{opacity:.45;color:#8a9099;cursor:default;}
button{transition:transform .12s;-webkit-tap-highlight-color:transparent;}
.chip:active{transform:scale(.9);}
.sw:active{transform:scale(.94);}
.pressing{transform:scale(.9)!important;filter:brightness(.95);transition:transform .08s;}
.sess-head{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;}

.tbl-sheet-body{padding:2px 2px 12px;}
.tbl-block{margin-bottom:18px;}
.tbl-head{border-radius:14px;padding:13px 15px;font-weight:800;font-size:16px;color:#3F4A4E;margin-bottom:10px;}
.tbl-lessons{display:flex;flex-direction:column;gap:10px;}
.lesson-card{background:#fff;border-radius:10px;padding:8px 10px;margin:0;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.lesson-card.flag{border-left:4px solid var(--amber);}
.lc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.lc-lesson{font-weight:700;font-size:14px;}
.lc-flag{background:var(--amber);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px;}
.lc-add{margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(62,155,170,.3);}
.lc-add:active{transform:scale(.95);}
.lc-note{color:var(--amber);font-size:12px;margin-top:4px;}
.lc-acts{margin-left:auto;display:flex;gap:6px;align-items:center;}
.lesson-card.added{border-left:4px solid #8b5cf6;}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:18px;}
.modal-mask.hidden{display:none;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:88vh;overflow:auto;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.modal-title{font-size:17px;font-weight:800;color:var(--primary-d);margin-bottom:12px;}
.modal-body .fld{display:block;font-size:13px;color:#334155;margin-bottom:12px;font-weight:700;}
.modal-body .fld input,.modal-body .fld textarea{width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:15px;font-family:inherit;box-sizing:border-box;}
.modal-body .fld textarea{resize:vertical;line-height:1.6;}
.fld-hint{font-size:12px;color:var(--sub);line-height:1.6;margin:2px 0;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}
.modal-actions .btn{flex:none;min-width:96px;padding:11px 18px;font-size:15px;}

/* 每日听写 */
.day{background:var(--card);border-radius:var(--r);margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden;}
.day-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.day-date{font-weight:700;}
.day-wk{color:var(--sub);font-size:13px;}
.day-cnt{margin-left:auto;color:var(--primary-d);font-size:13px;font-weight:700;}
.day-arrow{color:var(--sub);}
.day-sup{padding:8px 14px 2px;}
.day-sup .cal-btn.block{width:100%;justify-content:center;background:#FFF7ED;border-color:#FED7AA;color:#C2410C;}
.sess{padding:0 12px 10px;border-top:1px solid var(--line);}
.sess-bar{display:flex;justify-content:flex-end;margin:4px 0 2px;}
.sess-del{border:none;background:transparent;color:var(--red);font-size:12px;font-weight:600;padding:3px 6px;border-radius:6px;}
.sess-del:active{background:#FDECEC;}
.sess-les{padding:10px 0;border-bottom:1px dashed var(--line);}
.sess-les:last-child{border-bottom:none;}
.sl-head{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:6px;}
.sl-wrong{color:var(--red);font-size:12px;}
.sl-ok{color:#10b981;font-size:12px;}
.sl-items{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.si{background:var(--tint);border-radius:7px;padding:3px 8px;font-size:13px;}
.si-wrong{background:#fee2e2;color:var(--red);text-decoration:line-through;}
.sl-acts{display:flex;flex-wrap:wrap;gap:8px;}
.mini{background:#fff;border:1.5px solid #2563EB;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;color:#2563EB;}
.mini:active{transform:scale(.95);}
.backup-row{display:flex;gap:10px;margin-top:16px;}
.backup-btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:700;color:var(--primary-d);box-shadow:0 1px 3px rgba(0,0,0,.05);}
.backup-btn.ghost{background:#EAF1F2;color:var(--ink);}
.backup-btn:active{transform:scale(.97);}
.backup-hint{color:var(--sub);font-size:12px;margin:8px 2px 4px;line-height:1.6;}
.bk-area{width:100%;height:160px;margin-top:8px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;resize:vertical;line-height:1.5;}

/* 统计 */
.seg{display:flex;gap:6px;margin-bottom:12px;}
.seg-btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 0;font-weight:700;font-size:13px;color:var(--sub);}
.seg-btn.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.stat-card{background:var(--card);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.stat-rate{font-size:42px;font-weight:800;color:var(--primary-d);}
.stat-sub{color:var(--sub);font-size:13px;margin-top:4px;}
.bars{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;}
.bar-d{width:46px;color:var(--sub);}
.bar-track{flex:1;height:16px;background:var(--tint);border-radius:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:8px;transition:height .3s;}
.bar-v{width:64px;text-align:right;color:var(--sub);}

/* 购物车浮标 */
.cart-fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:200;width:64px;height:64px;border-radius:22px;
  border:none;background:linear-gradient(135deg,#FFA05C,#FF8C42);color:#fff;box-shadow:0 6px 18px rgba(231,111,46,.45);
  display:flex;align-items:center;justify-content:center;transition:top .22s ease,right .22s ease;}
.cart-fab:active{transform:scale(.94);}
.cart-fab.has{background:linear-gradient(135deg,#7DD07B,#5CB85C);box-shadow:0 6px 18px rgba(92,184,92,.45);}
.cart-badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 1px 3px rgba(0,0,0,.2);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.2);}
.sheet-head{display:flex;align-items:center;font-weight:800;font-size:17px;margin-bottom:10px;}
.sheet-head .x{margin-left:auto;}
.x{background:none;border:none;font-size:24px;color:var(--sub);line-height:1;padding:0 6px;}
.x.sm{font-size:18px;margin-left:auto;}
.sheet-acts{display:flex;gap:10px;margin-top:14px;}
.btn{flex:1;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.warn{background:var(--amber);color:#fff;}
.btn.ghost{background:#EAF1F2;color:var(--ink);}
.btn:active{transform:scale(.98);}

.cart-list{display:flex;flex-direction:column;gap:8px;}
.cart-item{background:var(--tint);border-radius:10px;padding:8px 10px;}
.ci-head{display:flex;align-items:center;font-weight:700;font-size:14px;margin-bottom:4px;}
.ci-items{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--sub);margin-bottom:2px;}
.ci-word{background:#fff;border-radius:7px;padding:3px 8px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.ci-word{color:var(--ink);}
.ci-title{cursor:pointer;flex:1;user-select:none;}
.ci-title.open{color:var(--primary);}
.ci-edit{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
.ci-edit-head{font-size:12px;color:var(--sub);margin-bottom:7px;}
.ci-edit-head b{color:var(--primary);}
.ci-edit-grid{display:flex;flex-wrap:wrap;gap:6px;}
.ci-pick{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:15px;font-weight:700;color:var(--sub);min-width:42px;text-align:center;font-family:inherit;}
.ci-pick.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.ci-pick:active{transform:scale(.94);}
.ci-edit-acts{display:flex;gap:8px;margin-top:8px;}

/* 听写会话 */
.session{position:fixed;inset:0;z-index:60;max-width:720px;margin:0 auto;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));}
.sess-tip{font-size:13px;color:var(--sub);margin:2px 0 10px;}
.sess-list{flex:1;overflow:auto;margin:8px 0;}
.dict-group{padding:12px 0;border-bottom:1px dashed var(--line);}
.dict-group:last-child{border-bottom:none;}
.dg-head{font-weight:800;font-size:14px;color:var(--primary-d);margin-bottom:10px;}
.dg-items{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;}
.sw{position:relative;background:#fff;border-radius:12px;padding:14px;min-width:68px;min-height:54px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--ink);border:2px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.05);}
.sw.wrong{background:#FFF0F0;color:var(--red);border-color:var(--red);}
.sess-acts{display:flex;gap:10px;}
.sw.has-spk{padding-right:26px;}
.sw .spk{position:absolute;right:5px;top:5px;font-size:13px;line-height:1;opacity:.5;cursor:pointer;}
.sw .spk:active{opacity:1;}
.sw.speaking{outline:3px solid var(--primary);background:#FFF3E6;}
.voice-card{margin:10px 14px;background:#F0F9FF;border:1px solid #BFE3FF;border-radius:12px;padding:10px 12px;}
.vc-head{font-weight:800;font-size:15px;color:#0B6EB5;display:flex;align-items:center;gap:6px;}
.vc-body{margin-top:8px;}
.vc-row{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 0;}
.vc-row input[type=range]{flex:1;min-width:0;}
.vc-row select{flex:1;min-width:0;padding:6px;border-radius:8px;border:1px solid var(--line);font-size:14px;background:#fff;}
.vc-tip{font-size:12px;color:#5a7a90;line-height:1.6;margin-top:6px;}
.vc-check{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0 2px;color:#234;line-height:1.5;cursor:pointer;}
.vc-check input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:#0B6EB5;}
.hidden{display:none !important;}

.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;background:rgba(17,24,39,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:80%;text-align:center;}

/* 日历筛选 */
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.cal-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--primary-d);box-shadow:0 1px 3px rgba(0,0,0,.05);}
.cal-btn:active{transform:scale(.95);}
.cal-cnt{background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:2px;}
.cal-clear{border:none;background:transparent;color:var(--sub);font-size:13px;font-weight:700;padding:6px 8px;border-radius:8px;}
.cal-clear:active{background:var(--tint);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;}
.cal-nav-btn{border:none;background:var(--tint);color:var(--primary-d);width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:800;line-height:1;}
.cal-nav-btn:active{transform:scale(.92);}
.cal-mtitle{font-weight:800;font-size:16px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,34px);grid-auto-rows:34px;gap:6px;justify-content:center;}
.cal-wk{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);font-weight:700;}
.cal-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);border-radius:50%;}
.cal-cell.empty{visibility:hidden;}
.cal-cell.today{border:1.5px solid var(--primary);}
.cal-cell.on{background:var(--primary);color:#fff;}
.cal-cell.on.today{border-color:#fff;}
.cal-cell:active{filter:brightness(.95);}
.cal-foot{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 4px;}
.cal-info{color:var(--sub);font-size:13px;font-weight:700;}
.cust-list{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
.cust-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:2px solid var(--tint-2);}
.cust-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cust-name{font-weight:800;font-size:16px;}
.cust-cnt{color:var(--sub);font-size:13px;font-weight:700;}
.cust-acts{display:flex;gap:8px;margin-top:10px;}
.btn.block{width:100%;margin-top:4px;}
.cal-clear2{border:none;background:var(--tint);color:var(--primary-d);font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;}

/* ===== 必背模块 ===== */
.bbei-group{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.bbei-ghead{font-weight:800;font-size:15px;color:var(--primary-d);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.bbei-ghead .badge{font-size:11px;background:var(--tint);color:var(--primary-d);padding:1px 8px;border-radius:999px;font-weight:700;}
.bbei-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.bbei-card:last-child{margin-bottom:0;}
.bbei-ctitle{font-weight:800;font-size:15px;margin-bottom:2px;}
.bbei-meta{font-size:12px;color:var(--sub);margin-bottom:8px;}
.bbei-tags{display:inline-block;background:var(--tint);color:var(--primary-d);font-size:11px;padding:1px 7px;border-radius:6px;margin-right:5px;font-weight:700;}
.bbei-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.bbei-acts .btn,.bbei-acts .mini{padding:8px 12px;font-size:13px;flex:none;min-width:88px;}
/* 必背目录式导航 */
.bbei-crumb{display:flex;align-items:center;gap:6px;font-size:13px;margin:2px 2px 12px;flex-wrap:wrap;}
.bbei-crumb-item{color:var(--primary-d);font-weight:700;cursor:pointer;padding:3px 8px;border-radius:8px;}
.bbei-crumb-item:active{background:var(--tint);}
.bbei-crumb-sep{color:var(--sub);}
.bbei-crumb-cur{color:var(--text);font-weight:700;padding:3px 2px;}
.bbei-dir{background:var(--card);border-radius:var(--r);padding:4px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;}
.bbei-dir:active{background:var(--tint);}
.bbei-dir-row{display:flex;align-items:center;gap:10px;padding:14px 0;}
.bbei-dir-name{font-weight:800;font-size:16px;color:var(--text);flex:none;}
.bbei-dir-sub{font-size:12px;color:var(--sub);flex:1;}
.bbei-dir-arrow{font-size:20px;color:var(--primary-d);font-weight:700;flex:none;}
.bbei-note{white-space:pre-wrap;background:var(--tint);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;color:#5a4632;margin-top:6px;}
.bbei-line{font-size:17px;line-height:1.8;margin:4px 0;padding:6px 8px;border-radius:8px;background:#fff;border:1px solid var(--line);}
.bbei-ch{display:inline-block;padding:2px 4px;border-radius:6px;font-size:22px;font-weight:700;margin:1px;cursor:pointer;transition:background .12s;}
.bbei-ch.wrong{background:#fee2e2;color:var(--red);}
.bbei-ch.blank{opacity:.28;font-size:14px;}
.bbei-play-head{font-weight:800;font-size:18px;color:var(--primary-d);margin-bottom:4px;}
.bbei-progress{font-size:13px;color:var(--sub);margin-bottom:10px;}
.bbei-part{margin-bottom:12px;}
.bbei-part-label{font-size:12px;color:var(--sub);font-weight:800;margin-bottom:3px;letter-spacing:.05em;}
.bbei-part-chars{display:flex;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;}

/* ===== 错因标注 dock ===== */
.reason-dock{background:#fff;border:1.5px solid var(--amber);border-radius:14px;padding:10px 12px;margin:6px 0;max-height:38vh;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.reason-dock.hidden{display:none;}
.rd-head{font-size:13px;font-weight:800;color:var(--primary-d);margin-bottom:8px;}
.rd-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);}
.rd-row:last-child{border-bottom:none;}
.rd-text{font-size:18px;font-weight:800;color:var(--red);min-width:34px;text-align:center;flex:none;}
.rd-chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
.rchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--sub);}
.rchip.on{background:var(--amber);color:#fff;border-color:var(--amber);}
.rchip:active{transform:scale(.92);}

/* ===== 错字本 / 复习 ===== */
.search-box{margin-bottom:10px;}
.search-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit;box-sizing:border-box;background:#fff;}
.search-input:focus{outline:none;border-color:var(--primary);}
.wb-group{background:var(--card);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.wb-ghead{font-weight:800;font-size:14px;color:var(--primary-d);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.wb-gcnt{font-size:11px;background:var(--tint);color:var(--primary-d);padding:1px 8px;border-radius:999px;font-weight:700;}
.wb-row{padding:8px 0;border-bottom:1px dashed var(--line);}
.wb-row:last-child{border-bottom:none;}
.wb-main{display:flex;align-items:center;gap:8px;}
.wb-text{font-size:18px;font-weight:800;color:var(--red);}
.wb-times{font-size:12px;color:var(--sub);font-weight:700;}
.wb-reason{margin-left:auto;font-size:11px;background:var(--amber);color:#fff;padding:1px 8px;border-radius:999px;font-weight:700;}
.wb-sub{font-size:12px;color:var(--sub);margin:2px 0 4px;}
.wb-acts{display:flex;gap:8px;}
.wb-due{font-size:11px;font-weight:800;color:#fff;background:var(--primary);padding:1px 8px;border-radius:999px;margin-left:4px;}

/* ===== 今日复习 ===== */
.rep-summary{font-size:15px;font-weight:700;color:var(--ink);margin:2px 0 4px;}
.rep-summary b{color:var(--primary);}
.rev-list{display:flex;flex-direction:column;gap:8px;}
.rev-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.rev-row.due{border-color:var(--primary);box-shadow:0 2px 10px rgba(255,140,66,.14);}
.rev-row.muted{opacity:.6;}
.rev-main{display:flex;align-items:center;gap:8px;}
.rev-text{font-size:20px;font-weight:800;color:var(--ink);}
.rev-times{font-size:12px;color:var(--sub);}
.rev-reason{font-size:12px;background:var(--amber);color:#fff;padding:1px 8px;border-radius:999px;font-weight:700;}
.rev-sub{font-size:13px;color:var(--sub);}
.rev-phase{font-size:13px;font-weight:800;color:var(--primary);margin-top:3px;}
.rev-acts{margin-top:6px;}

/* ===== 报告页 ===== */
.rep-card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.rep-title{font-weight:800;font-size:15px;color:var(--primary-d);margin-bottom:10px;}
.rep-empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0;}
.mastery{display:flex;flex-direction:column;gap:10px;}
.mb-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.mb-name{width:54px;font-weight:700;color:var(--ink);flex:none;}
.mb-track{flex:1;height:14px;background:var(--tint);border-radius:8px;overflow:hidden;}
.mb-fill{height:100%;border-radius:8px;transition:width .4s ease;}
.mb-v{width:42px;text-align:right;font-weight:800;color:var(--primary-d);}
.mb-cnt{width:48px;text-align:right;color:var(--sub);font-size:12px;}
.weak-list{display:flex;flex-direction:column;gap:6px;}
.weak-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--tint);border-radius:10px;font-size:13px;}
.weak-name{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.weak-rate{font-weight:800;color:var(--red);width:42px;text-align:right;}
.weak-cnt{color:var(--sub);font-size:12px;width:62px;text-align:right;}

/* 听写模式选择 */
.mode-cards{display:flex;flex-direction:column;gap:12px;margin:4px 0 8px;}
.mode-card{display:flex;align-items:flex-start;gap:12px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;cursor:pointer;transition:transform .08s,border-color .12s,box-shadow .12s;}
.mode-card:active{transform:scale(.98);}
.mode-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(255,140,66,.18);}
.mc-ico{font-size:30px;line-height:1;flex:none;}
.mc-title{font-weight:800;font-size:16px;color:var(--ink);margin-bottom:3px;}
.mc-desc{font-size:13px;color:var(--sub);line-height:1.5;}

/* 系统报听播放器 */
.sys-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:17px;margin-bottom:6px;}
.sys-head .x{margin:0;}
.sys-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.sys-py{font-size:46px;font-weight:800;letter-spacing:2px;color:var(--primary-d);text-align:center;line-height:1.2;}
.sys-mask{font-size:34px;color:var(--sub);letter-spacing:10px;}
.sys-foot{display:flex;gap:10px;margin-top:10px;}
.sys-tip{font-size:13px;color:var(--sub);margin-top:10px;text-align:center;line-height:1.5;}
.sys-tip #sysCount{font-weight:800;color:var(--primary);font-size:15px;}


/* ===== 看拼音写词语 ===== */
.pyw-wrap{max-width:760px;margin:0 auto;padding:4px 2px 24px}
.pyw-hd{font-size:18px;font-weight:700;margin:6px 2px 10px}
.pyw-hd .hint{font-size:12px;font-weight:400;color:var(--sub)}
.pyw-src{background:var(--card);border-radius:var(--r);padding:12px;margin:10px 2px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.pyw-src-t{font-weight:700;margin-bottom:8px;color:var(--ink)}
.pyw-gs{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pyw-ta{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:15px;font-family:inherit;resize:vertical;background:#fff}
.pyw-chips{display:flex;flex-wrap:wrap;gap:7px}
.pyw-chip{display:inline-flex;flex-direction:column;align-items:flex-start;background:#f4f7fb;border:1px solid #e3e9f2;border-radius:10px;padding:5px 9px;cursor:pointer;line-height:1.15;max-width:100%}
.pyw-chip b{font-size:13px;color:#2b6cb0;font-weight:600}
.pyw-chip span{font-size:13px;color:#444}
.pyw-chip.on{background:var(--tint);border-color:var(--amber)}
.pyw-chip.on b{color:var(--primary-d)}
.pyw-chip i{margin-left:6px;color:var(--red);font-style:normal;font-weight:700}
.pyw-les{margin-bottom:10px}
.pyw-les-t{font-size:13px;color:var(--sub);margin:2px 0 5px}
.pyw-sel{margin:10px 2px}
.pyw-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pyw-prev{margin:12px 2px;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.pyw-prev-hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px;font-size:14px}
.pyw-list{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-start}
.pyw-row{display:block;padding:8px 4px;border-bottom:1px dashed var(--line)}
.pyw-top{display:flex;align-items:center;gap:10px}
.pyw-row.shown{background:#fffaf2}
.pyw-no{color:var(--sub);min-width:20px}
.pyw-py{font-size:18px;color:#2b6cb0;min-width:140px}
.pyw-blank{flex:1;height:34px;border-bottom:2px solid #bbb}
.pyw-ans{font-size:22px;color:var(--red);font-weight:700}
.tzg{position:relative;width:36px;height:36px;border:1px solid #9aa6ab;box-sizing:border-box;display:inline-block;margin:0 2px;vertical-align:middle;background:#fff}
.tzg::before{content:"";position:absolute;left:50%;top:2px;bottom:2px;border-left:1px dashed #cdd3d8;transform:translateX(-.5px)}
.tzg::after{content:"";position:absolute;top:50%;left:2px;right:2px;border-top:1px dashed #cdd3d8;transform:translateY(-.5px)}
.tzg-d1,.tzg-d2{position:absolute;left:50%;top:2px;bottom:2px;width:0;border-left:1px dashed #dbe0e5;transform-origin:center;transform:translateX(-.5px) rotate(45deg);z-index:0}
.tzg-d2{transform:translateX(-.5px) rotate(-45deg)}
.tzg-ch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"KaiTi","STKaiti","楷体",serif;font-size:22px;color:var(--red);font-weight:700;z-index:2}
.pyw-tzg{display:flex;flex-wrap:wrap;margin-top:6px}
.pyw-print{display:none}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #pywPrint,#pywPrint *{visibility:visible}
  #pywPrint{display:block;position:absolute;left:0;top:0;width:100%}
  .pp-sheet{padding:6px 14px;font-family:"KaiTi","STKaiti","楷体",serif}
  .pp-title{font-size:22px;font-weight:700;text-align:center;margin:6px 0 4px;font-family:inherit}
  .pp-meta{font-size:14px;margin-bottom:16px;color:#222}
  .pp-list{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-start}
  .pp-row{display:block;font-size:18px}
  .pp-top{display:flex;align-items:baseline;gap:12px}
  .pp-no{min-width:22px;color:#333}
  .pp-py{color:#222;min-width:170px;font-family:inherit}
  .pp-tzg{display:flex;flex-wrap:wrap;margin-top:6px}
  .tzg{width:42px;height:42px;border:1px solid #333;margin:0 3px}
  .tzg::before{border-left:1px dashed #b9b9b9}
  .tzg::after{border-top:1px dashed #b9b9b9}
  .tzg-d1,.tzg-d2{border-left:1px dashed #dcdcdc}
  .tzg-ch{font-size:28px;color:#000;font-weight:400}
  .pp-fill-hd{font-size:14px;color:#222;margin:16px 0 6px}
  .pp-fill{display:flex;flex-wrap:wrap;gap:0}
}

</style>

    <button class="tab" data-tab="pinyin"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg><span>拼音写词</span></button>
    <button class="tab" data-tab="stats"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>报告</span></button>
    <button class="tab" data-tab="custom"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>自定义</span></button>
  </nav>
  <main id="view"></main>
  <div id="pywPrint" class="pyw-print"></div>
</div>

<button id="cartFab" class="cart-fab" aria-label="听写列表">
  <svg class="cart-ico" viewBox="0 0 64 64" width="40" height="40">
    <circle cx="32" cy="32" r="30" fill="url(#fabGrad)"/>
    <path d="M18 30 C18 18 46 18 46 30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <rect x="12" y="28" width="15" height="20" rx="5" fill="#4A90E2"/>

    <defs>
      <linearGradient id="fabGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFA05C"/>
        <stop offset="100%" stop-color="#FF8C42"/>

<script>
// 本地存储层：历史、错词库、购物车、进度、设置、上次标签、多娃
const Store = (function () {
  const PREFIX = 'dict.v1.';
  const K = { history: 'history', wrong: 'wrong', cart: 'cart', plan: 'plan', settings: 'settings', lastTab: 'lasttab', custom: 'custom', kids: 'kids', curKid: 'curkid', backedUp: 'backedup', dataver: 'dataver', backupver: 'backupver' };
  function get(k, def) { try { const v = localStorage.getItem(PREFIX + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) {} }

  // ---------- 多娃：历史 / 错词 按娃隔离，购物车切娃清空 ----------
  function curKid() { return get(K.curKid, 'k0'); }
  function allHist() { return get(K.history, {}); }
  function kidHist() { return allHist()[curKid()] || []; }
  function setKidHist(arr) { const all = allHist(); all[curKid()] = arr; set(K.history, all); }

  // ---------- 教材自定义修改层（编辑/删除/新增，持久化） ----------
  const TABLES = ['识字表', '写字表', '词语表'];
  const CUST_KEY = 'dict.cust.v1';
  function loadCust() {
    try {
      const c = JSON.parse(localStorage.getItem(PREFIX + CUST_KEY) || '{}');
      return Object.assign({ lessons: {}, deleted: [], added: [] }, c);
    } catch (e) { return { lessons: {}, deleted: [], added: [] }; }
  }
  function saveCust(c) { try { localStorage.setItem(PREFIX + CUST_KEY, JSON.stringify(c)); } catch (e) {} }
  function slotId(g, sem, table, idx) { return g + '|' + sem + '|' + table + '|' + idx; }

  function getEffectiveData() {
    const base = window.APP_DATA;
    const cust = loadCust();
    const deleted = new Set(cust.deleted);
    const grades = base.grades.map(gd => {
      const tables = {};
      TABLES.forEach(t => {
        const arr = gd.tables[t] || [];
        const out = [];
        arr.forEach((l, idx) => {
          const sid = slotId(gd.grade, gd.sem, t, idx);
          if (deleted.has(sid)) return;
          const ed = cust.lessons[sid];
          if (ed) {
            out.push({ lesson: (ed.label != null ? ed.label : l.lesson), items: (ed.items != null ? ed.items : l.items), note: l.note, _meta: { kind: 'base', sid, idx } });
          } else {
            out.push({ lesson: l.lesson, items: l.items, flag: l.flag, note: l.note, _meta: { kind: 'base', sid, idx } });
          }
        });
        cust.added.forEach(a => { if (a.grade === gd.grade && a.sem === gd.sem && a.table === t) out.push({ lesson: a.label, items: a.items, added: true, _meta: { kind: 'added', id: a.id } }); });
        tables[t] = out;
      });
      return { grade: gd.grade, sem: gd.sem, tables };
    });
    return { version: base.version, grades };
  }
  function editLesson(meta, label, items) {
    const c = loadCust();
    if (meta.kind === 'base') { c.lessons[meta.sid] = { label, items }; }
    else { const a = c.added.find(x => x.id === meta.id); if (a) { a.label = label; a.items = items; } }
    saveCust(c); set(K.dataver, get(K.dataver, 0) + 1);
  }
  function deleteLesson(meta) {
    const c = loadCust();
    if (meta.kind === 'base') { if (!c.deleted.includes(meta.sid)) c.deleted.push(meta.sid); }
    else { c.added = c.added.filter(x => x.id !== meta.id); }
    saveCust(c); set(K.dataver, get(K.dataver, 0) + 1);
  }
  function addLesson(g, sem, table, label, items) {
    const c = loadCust();
    c.added.push({ id: 'add_' + Date.now() + '_' + Math.floor(Math.random() * 1000), grade: g, sem, table, label, items });
    saveCust(c); set(K.dataver, get(K.dataver, 0) + 1);
  }
  function getCust() { return loadCust(); }
  function importCust(obj) {
    if (obj && obj.lessons && obj.added) { saveCust({ lessons: obj.lessons || {}, deleted: obj.deleted || [], added: obj.added || [] }); return true; }
    return false;
  }
  function resetCust() { saveCust({ lessons: {}, deleted: [], added: [] }); }

  return {
    getHistory: () => kidHist(),
    setHistory: (h) => setKidHist(h),
    getAllHistory: () => allHist(),
    setAllHistory: (o) => set(K.history, o || {}),
    getWrong: () => get(K.wrong, []),
    setWrong: (w) => set(K.wrong, w),
    getCart: () => get(K.cart, []),
    setCart: (c) => set(K.cart, c),
    getCustom: () => get(K.custom, []),
    setCustom: (arr) => set(K.custom, arr),
    getPlan: () => get(K.plan, {}),
    setPlan: (p) => set(K.plan, p),
    getSettings: () => get(K.settings, { reads: 2, interval: 1.5, rate: 0.9, pitch: 1.15, voiceURI: '', ttsSource: 'cloud' }),
    setSettings: (s) => set(K.settings, s),
    getLastTab: () => get(K.lastTab, 'tables'),
    setLastTab: (t) => set(K.lastTab, t),

    // 多娃
    getKids: () => get(K.kids, [{ id: 'k0', name: '默认' }]),
    setKids: (a) => set(K.kids, a),
    getCurKid: () => curKid(),
    setCurKid: (id) => set(K.curKid, id),

    getBackedUp: () => get(K.backedUp, false),
    setBackedUp: (b) => set(K.backedUp, !!b),

    getDataVer: () => get(K.dataver, 0),
    getBackupVer: () => get(K.backupver, null),
    setBackupVer: (v) => set(K.backupver, v),
    incData: () => set(K.dataver, get(K.dataver, 0) + 1),

    pushCart(item) {
      const c = get(K.cart, []);
      const ex = c.find(x => x.key === item.key);
      if (ex) {
        item.items.forEach(w => { if (!ex.items.includes(w)) ex.items.push(w); });
        if (Array.isArray(ex.pick)) { item.items.forEach(w => { if (!ex.pick.includes(w)) ex.pick.push(w); }); }
        else ex.pick = ex.items.slice();
        set(K.cart, c); return false;
      }
      c.push(item); set(K.cart, c); return true;
    },
    removeCart(key) { set(K.cart, get(K.cart, []).filter(x => x.key !== key)); },
    clearCart() { set(K.cart, []); },

    getEffectiveData,
    editLesson, deleteLesson, addLesson, getCust, importCust, resetCust,
  };
})();

</script>

  const BEIBEI_SEED_2SHANG = [
    {type:'古诗', title:'梅花', author:'（宋）王安石', unit:'', lines:['墙角数枝梅，','凌寒独自开。','遥知不是雪，','为有暗香来。']},
    {type:'课文', title:'树之歌', author:'', unit:'识字一', lines:['杨树高，榕树壮，梧桐树叶像手掌。','枫树秋天叶儿红，松柏四季披绿装。','木棉喜暖在南方，桦树耐寒守北疆。','银杏水杉活化石，金桂开花满院香。']},
    {type:'谚语', title:'树之歌·课后第三题', author:'', unit:'识字一', lines:['十年树木，百年树人。','树高百尺，落叶归根。','树无根不长，人无志不立。']},
    {type:'课文', title:'田家四季歌', author:'', unit:'识字二', lines:['春季里，春风吹，花开草长蝴蝶飞。麦苗儿多嫩，桑叶儿正肥。','夏季里，农事忙，采桑养蚕又插秧。早起勤耕作，归来戴月光。','秋季里，稻上场，谷像黄金粒粒香。身体虽辛苦，心里喜洋洋。','冬季里，雪初晴，新制棉衣暖又轻。一年农事了，大家笑盈盈。']},
    {type:'谚语', title:'数九歌', author:'', unit:'语文园地二', lines:['一九二九不出手。','三九四九冰上走。','五九六九，沿河看柳。','七九河开，八九燕来。','九九加一九，耕牛遍地走。']},
    {type:'古诗', title:'小儿垂钓', author:'（唐）胡令能', unit:'', lines:['蓬头稚子学垂纶，','侧坐莓苔草映身。','路人借问遥招手，','怕得鱼惊不应人。']},
    {type:'古诗', title:'登鹳雀楼', author:'（唐）王之涣', unit:'', lines:['白日依山尽，','黄河入海流。','欲穷千里目，','更上一层楼。']},
    {type:'古诗', title:'望庐山瀑布', author:'（唐）李白', unit:'', lines:['日照香炉生紫烟，','遥看瀑布挂前川。','飞流直下三千尺，','疑是银河落九天。']},
    {type:'段落', title:'日月潭', author:'', unit:'第9课', lines:['日月潭很深，湖水碧绿。湖中央有个美丽的小岛，把湖水分成两半，北边像圆圆的太阳，叫日潭；南边像弯弯的月亮，叫月潭。','清晨，湖面上飘着薄薄的雾。天边的晨星和山上的点点灯光，隐隐约约地倒映在湖水中。','中午，太阳高照，整个日月潭的美景和周围的建筑，都清晰地展现在眼前。要是下起蒙蒙细雨，日月潭好像披上轻纱，周围的景物一片朦胧，就像童话中的仙境。']},
    {type:'对联', title:'有山皆图画，无水不文章。', author:'', unit:'语文园地四', note:'有山水的地方就像图画和文章一样美丽。', lines:['有山皆图画，无水不文章。']},
    {type:'对联', title:'白马西风塞上，杏花烟雨江南。', author:'', unit:'语文园地四', note:'西风吹拂的塞北草原上，一群骏马在纵情奔驰；烟雨朦胧的江南，杏花在春雨中绽放。', lines:['白马西风塞上，杏花烟雨江南。']},
    {type:'对联', title:'清风明月本无价，近水远山皆有情。', author:'', unit:'语文园地四', note:'清风明月这样的自然景色是无价的，无法用金钱来衡量。近水与远山相映成趣，别有韵味。', lines:['清风明月本无价，近水远山皆有情。']},
    {type:'对联', title:'雾锁山头山锁雾，天连水尾水连天。', author:'', unit:'语文园地四', note:'大雾弥漫，看不清远处的山峰；水天一色，天水相接。', lines:['雾锁山头山锁雾，天连水尾水连天。']},
    {type:'名言', title:'少年不知勤学苦，老来方知读书迟。', author:'', unit:'语文园地五', note:'年少时不知道勤奋刻苦地学习，等到年纪大了才明白要读书，却已经太迟了。出自唐代颜真卿《劝学》，劝勉少年把握时光、勤奋学习。', lines:['少年不知勤学苦，老来方知读书迟。']},
    {type:'名言', title:'一日读书一日功，一日不读十日空。', author:'', unit:'语文园地五', note:'读一天书就有一天的收获，如果有一天没读书就会丢失十天的收获。', lines:['一日读书一日功，一日不读十日空。']},
    {type:'名言', title:'书山有路勤为径，学海无涯苦作舟。', author:'', unit:'语文园地五', note:'在读书、学习的道路上，没有捷径可走，也没有顺风船可驶。勤奋和刻苦是必不可少的。出自韩愈。', lines:['书山有路勤为径，学海无涯苦作舟。']},
    {type:'名言', title:'有志者事竟成。', author:'——《后汉书》', unit:'语文园地六', note:'有志向的人做事终究会成功。', lines:['有志者事竟成。']},
    {type:'名言', title:'志当存高远。', author:'——诸葛亮', unit:'语文园地六', note:'一个人应该树立远大的理想。', lines:['志当存高远。']},
    {type:'名言', title:'穷且益坚，不坠青云之志。', author:'——王勃', unit:'语文园地六', note:'一个人处境越是艰难，越是坚韧不拔，越是不丢失高远之志。', lines:['穷且益坚，不坠青云之志。']},
    {type:'古诗', title:'江雪', author:'（唐）柳宗元', unit:'', lines:['千山鸟飞绝，','万径人踪灭。','孤舟蓑笠翁，','独钓寒江雪。']},
    {type:'古诗', title:'敕勒歌', author:'北朝民歌', unit:'', lines:['敕勒川，阴山下。','天似穹庐，笼盖四野。','天苍苍，野茫茫，','风吹草低见牛羊。']},
    {type:'古诗', title:'夜宿山寺', author:'（唐）李白', unit:'', lines:['危楼高百尺，','手可摘星辰。','不敢高声语，','恐惊天上人。']},
    {type:'名言', title:'己所不欲，勿施于人。', author:'——《论语》', unit:'语文园地八', note:'自己不愿意的，不要施加给别人。', lines:['己所不欲，勿施于人。']},
    {type:'名言', title:'与朋友交，言而有信。', author:'——《论语》', unit:'语文园地八', note:'与朋友交往时说话要讲诚信。', lines:['与朋友交，言而有信。']},
    {type:'名言', title:'不以规矩，不能成方圆。', author:'——《孟子》', unit:'语文园地八', note:'不以规矩，不能成方圆，比喻为人做事，没有法规的约束，就难入正轨。', lines:['不以规矩，不能成方圆。']}

  const BEIBEI_SEED_4SHANG = [
    {type:'古诗', title:'赠刘景文', author:'（宋）苏轼', unit:'古诗', lines:['荷尽已无擎雨盖，菊残犹有傲霜枝。','一年好景君须记，最是橙黄橘绿时。'], note:'注释：刘景文：诗人好友。荷尽：荷花枯萎凋谢。擎雨盖：比喻荷叶。菊残：菊花凋零。傲霜：不畏寒霜。君：您。橙黄橘绿时：秋末初冬果实成熟的时节。\n诗意：荷花凋零，连托雨的荷叶都枯萎了，只剩残菊花枝傲立寒霜。你要记住，一年最美的风光，就是橙子金黄、橘子青绿的初冬时节。\n解读：赠友劝勉诗，借秋冬景物托物言志。前两句枯荷、残菊对比，赞美菊花坚贞傲骨；后两句跳出悲秋，写初冬硕果生机，劝慰友人不必因境遇消沉，暮年依旧大有可为。'},
    {type:'古诗', title:'暮江吟', author:'（唐）白居易', unit:'古诗', lines:['一道残阳铺水中，半江瑟瑟半江红。','可怜九月初三夜，露似真珠月似弓。'], note:'注释：瑟瑟：江水青绿的颜色。可怜：可爱。真珠：珍珠。\n诗意：夕阳余晖平铺江面，江水一半青绿一半艳红。九月初三的夜晚格外动人，露珠像珍珠，弯月如同弯弓。\n解读：分黄昏、月夜两幅画面。"铺"字写出夕阳柔和，冷暖色彩对比鲜明；后两句比喻生动，勾勒清新秋夜，饱含诗人对自然美景的喜爱。'},
    {type:'古诗', title:'题西林壁', author:'（宋）苏轼', unit:'古诗', lines:['横看成岭侧成峰，远近高低各不同。','不识庐山真面目，只缘身在此山中。'], note:'注释：题：题写。西林：西林寺。缘：因为。\n诗意：横看庐山是连绵山岭，侧看是陡峭山峰，远近高低观望，景色各不相同。看不清庐山全貌，只因自己身处山中。\n解读：写景蕴含哲理：观察角度不同，所见事物样貌不同；人容易受自身处境局限，难以看清事物本质。对应俗语"当局者迷，旁观者清"。'},
    {type:'古诗', title:'雪梅', author:'（宋）卢钺', unit:'古诗', lines:['梅雪争春未肯降，骚人阁笔费评章。','梅须逊雪三分白，雪却输梅一段香。'], note:'注释：降：服输。骚人：诗人。阁：同"搁"。评章：评判高下。逊：比不上。\n诗意：梅花和白雪都争抢春色不肯认输，诗人只好放下笔难以评判。梅花比不上雪花洁白，雪花却少了梅花一缕清香。\n解读：拟人手法写梅、雪争春。客观点明二者各有长处：雪白、梅香。道理同"尺有所短，寸有所长"。'},
    {type:'古诗', title:'出塞', author:'（唐）王昌龄', unit:'古诗', lines:['秦时明月汉时关，万里长征人未还。','但使龙城飞将在，不教胡马度阴山。'], note:'注释：但使：只要。龙城飞将：汉代李广。教：让。胡马：北方外族骑兵。阴山：北方边关山脉。\n诗意：自秦汉延续至今的明月边关，出征万里的将士依旧没能回乡。倘若还有飞将军镇守，绝不会让外敌越过阴山。\n解读：开篇营造苍凉悠远的边塞氛围，感慨常年征战、将士难归；后两句期盼良将、渴望边关安宁，饱含忧国忧民之心。'},
    {type:'古诗', title:'凉州词', author:'（唐）王翰', unit:'古诗', lines:['葡萄美酒夜光杯，欲饮琵琶马上催。','醉卧沙场君莫笑，古来征战几人回？'], note:'注释：凉州词：唐代边塞曲名。夜光杯：美玉制成的酒杯。沙场：战场。\n诗意：精致酒杯盛满葡萄酒，将士正要举杯，军中琵琶声催人奔赴战场。就算醉倒沙场也请不要取笑，从古外出征战，又有几人能平安归来？\n解读：边塞诗，写将士出征前饮酒赴战的场景，豪迈中透着悲凉。'},
    {type:'古诗', title:'夏日绝句', author:'（宋）李清照', unit:'古诗', lines:['生当作人杰，死亦为鬼雄。','至今思项羽，不肯过江东。'], note:'诗意：活着应当做人中豪杰，死了也要做鬼中英雄。\n解读：抒发崇高气节与爱国情怀。借项羽宁死不屈的典故，批判朝廷苟且偷安。'},
    {type:'古诗', title:'别董大', author:'（唐）高适', unit:'古诗', lines:['千里黄云白日曛，北风吹雁雪纷纷。','莫愁前路无知己，天下谁人不识君？'], note:'注释：董大：董庭兰，著名琴师。曛：天色昏暗。\n诗意：漫天黄云遮蔽日光，北风呼啸，大雁在大雪中南飞。不必担心前路没有知心朋友，天下谁不认识才华出众的你？\n解读：边塞送别诗。后两句豪迈劝慰友人，高度认可对方才华，胸襟开阔豁达。'},
    {type:'古诗', title:'黄鹤楼送孟浩然之广陵', author:'（唐）李白', unit:'古诗', lines:['故人西辞黄鹤楼，烟花三月下扬州。','孤帆远影碧空尽，唯见长江天际流。'], note:'注释：之：前往。故人：老朋友。西辞：黄鹤楼在西侧，向东辞别。烟花：三月繁花如烟的春日盛景。\n诗意：好友在黄鹤楼与我辞别，繁花如烟的三月顺流去往扬州。孤船影子渐渐消失在天边，只剩长江滚滚流向远方。\n解读：经典送别诗。后两句以江水孤帆写景寄情，目送友人远去，藏着绵长不舍。'},
    {type:'文言文', title:'精卫填海', author:'《山海经·北山经》', unit:'文言文', lines:['炎帝之少女，名曰女娃。','女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。'], note:'注释：少女：小女儿。溺：溺水淹死。返：返回。故：因此。为：化作。堙：填塞。\n释义：炎帝的小女儿名叫女娃。她去东海游玩，溺水身亡没能回来，死后化作精卫鸟。它常年叼取西山树枝石块，想要填平东海。\n解读：出自《山海经》，颂扬不畏艰难、矢志不渝的坚韧精神。'},
    {type:'文言文', title:'王戎不取道旁李', author:'《世说新语·雅量》', unit:'文言文', lines:['王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。','人问之，答曰："树在道边而多子，此必苦李。"取之，信然。'], note:'注释：王戎：竹林七贤之一。尝：曾经。多子折枝：果实太多压弯树枝。竞走：争相奔跑。信然：确实如此。\n释义：王戎七岁时，和一群孩子玩耍。路边李子树果实压弯枝条，别的孩子争相跑去摘，只有王戎站着不动。他说："树长在路边还挂满果子，一定是苦李子。"大家摘下一尝，果然是苦的。\n解读：赞王戎善于观察、冷静推断，不从众，体现少年聪慧。'},
    {type:'名言', title:'为学患无疑，疑则有进。', author:'（宋）陆九渊', unit:'日积月累·治学', lines:['为学患无疑，疑则有进。'], note:'学习最怕没有疑问，心存疑惑才能不断进步。'},
    {type:'名言', title:'博学之，审问之，慎思之，明辨之，笃行之。', author:'《礼记》', unit:'日积月累·治学', lines:['博学之，审问之，慎思之，明辨之，笃行之。'], note:'五步学习法：广泛学习、细致发问、谨慎思考、分清是非、亲身实践。'},
    {type:'名言', title:'智能之士，不学不成，不问不知。', author:'王充', unit:'日积月累·治学', lines:['智能之士，不学不成，不问不知。'], note:'再有天赋的人，不学习不会成才，不提问不会明理。'},
    {type:'名言', title:'人非生而知之者，孰能无惑？', author:'（唐）韩愈', unit:'日积月累·治学', lines:['人非生而知之者，孰能无惑？'], note:'没有人天生通晓事理，谁都会有疑惑。'},
    {type:'名言', title:'善疑者，不疑人之所疑，而疑人之所不疑。', author:'（明）方以智', unit:'日积月累·治学', lines:['善疑者，不疑人之所疑，而疑人之所不疑。'], note:'真正善于思考质疑的人，不会纠结众人都看得见的问题，反而能在大家习常的细节里发现疑点。'},
    {type:'谚语', title:'立了秋，把扇丢。', author:'', unit:'日积月累·气象', lines:['立了秋，把扇丢。'], note:'立秋后气温转凉，不再需要扇子。'},
    {type:'谚语', title:'二八月，乱穿衣。', author:'', unit:'日积月累·气象', lines:['二八月，乱穿衣。'], note:'农历二、八月冷暖不定，人们穿衣厚薄不一。'},
    {type:'谚语', title:'夏雨少，秋霜早。', author:'', unit:'日积月累·气象', lines:['夏雨少，秋霜早。'], note:'夏季降水稀少，秋天霜冻会提前到来。'},
    {type:'谚语', title:'八月里来雁门开，雁儿脚上带霜来。', author:'', unit:'日积月累·气象', lines:['八月里来雁门开，雁儿脚上带霜来。'], note:'八月大雁南飞，预示北方降温、寒霜将至。'},
    {type:'谚语', title:'一场秋雨一场寒，十场秋雨要穿棉。', author:'', unit:'日积月累·气象', lines:['一场秋雨一场寒，十场秋雨要穿棉。'], note:'每次秋雨过后气温下降，多次降雨后需穿棉衣。'},
    {type:'谚语', title:'八月暖，九月温，十月还有小阳春。', author:'', unit:'日积月累·气象', lines:['八月暖，九月温，十月还有小阳春。'], note:'八、九月气候温和，十月偶尔会出现温暖如春的天气。'},

  // ---------- 工具 ----------
  function gradeTitle(g, sem) { return CN[g] + '年级' + sem + '册'; }
  function lessonTitle(g, sem, table, lesson) { return CN[g] + '年级-' + sem + '册-' + table + '-' + lesson; }
  function getGrade(g, sem) { return D.grades.find(x => x.grade === g && x.sem === sem); }
  function getTable(g, sem, table) { const gd = getGrade(g, sem); return gd ? gd.tables[table] : []; }
  function getLessonItems(g, sem, table, lesson) { const t = getTable(g, sem, table); const l = t.find(x => x.lesson === lesson); return l ? l.items : []; }
  function prevSem(g, sem) { const i = SEM_ORDER.findIndex(x => x[0] === g && x[1] === sem); return i > 0 ? SEM_ORDER[i - 1] : null; }
  function nextSem(g, sem) { const i = SEM_ORDER.findIndex(x => x[0] === g && x[1] === sem); return (i >= 0 && i < SEM_ORDER.length - 1) ? SEM_ORDER[i + 1] : null; }

  function fmtDate(d) { const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return y + '-' + m + '-' + day; }
  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function weekday(d) { return '日一二三四五六'[d.getDay()]; }
  function yesterdayDate() { const d = new Date(); d.setDate(d.getDate() - 1); return d; }

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 1800);
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function parseItems(txt) { return txt.split(/[\n、，,\s]+/).map(s => s.trim()).filter(s => s.length); }
  function metaKey(m) { return m.kind === 'base' ? m.sid : m.id; }

    document.getElementById('modalBody').innerHTML = bodyHtml;

    actions.forEach(ac => { const b = document.createElement('button'); b.className = 'btn ' + (ac.cls || ''); b.textContent = ac.label; b.onclick = ac.onClick; a.appendChild(b); });
    document.getElementById('modalMask').classList.remove('hidden');

  function openLessonEditor(meta, addCtx) {
    const isAdd = !meta;
    const info = isAdd ? { g: addCtx.g, sem: addCtx.sem, table: addCtx.table, label: '', items: [] } : state.lessonIndex[metaKey(meta)];
    if (!info) { toast('未找到该课数据'); return; }
    const title = isAdd ? '添加课 · ' + gradeTitle(info.g, info.sem) + ' · ' + info.table : '编辑 · ' + info.label;
    const body = '<label class="fld">课次 / 名称<input id="mLbl" type="text" value="' + esc(info.label) + '" placeholder="如：1 或 语文园地一"></label>' +
      '<label class="fld">内容（每行一个，或用、分隔）<textarea id="mItems" rows="9">' + esc(info.items.join('\n')) + '</textarea></label>' +
      '<div class="fld-hint">识字表 / 写字表填汉字，词语表填词语。保存后自动在本地保存，下次打开仍在。</div>';
    openModal(title, body, [
      { label: '取消', cls: 'btn ghost', onClick: closeModal },
      { label: '保存', cls: 'btn primary', onClick: () => {
        const label = document.getElementById('mLbl').value.trim();
        const items = parseItems(document.getElementById('mItems').value);
        if (!label) { toast('请填写课次 / 名称'); return; }
        if (!items.length) { toast('请至少填写一个内容'); return; }
        if (isAdd) Store.addLesson(info.g, info.sem, info.table, label, items);
        else Store.editLesson(meta, label, items);
        D = Store.getEffectiveData();
        closeModal(); renderTables(); toast(isAdd ? '已添加新课' : '已保存修改');
      } }

  // ---------- 购物车 ----------
  function picked(it) { return Array.isArray(it.pick) ? it.pick : it.items; }
  function updateCartBadge() {
    const n = Store.getCart().reduce((s, x) => s + picked(x).length, 0);
    const b = document.getElementById('cartCount'); b.textContent = n;
    document.getElementById('cartFab').classList.toggle('has', n > 0);
  }
  function makeCartItem(g, sem, table, lesson) {
    const items = getLessonItems(g, sem, table, lesson).slice();
    return { key: g + '|' + sem + '|' + table + '|' + lesson, grade: g, sem, table, lesson, title: lessonTitle(g, sem, table, lesson), items, pick: items.slice() };
  }
  function addLesson(g, sem, table, lesson) {
    const items = getLessonItems(g, sem, table, lesson);
    if (items.length > 30 && !confirm('「' + lessonTitle(g, sem, table, lesson) + '」共 ' + items.length + ' 个，确定全部加入听写？')) return;
    const item = makeCartItem(g, sem, table, lesson);
    const isNew = Store.pushCart(item);
    updateCartBadge();
    toast(isNew ? '已加入：' + item.title : '已在听写列表');
  }
  function addWord(g, sem, table, lesson, idx) {
    const word = getLessonItems(g, sem, table, lesson)[idx];
    const key = g + '|' + sem + '|' + table + '|' + lesson;
    const cart = Store.getCart();
    let it = cart.find(x => x.key === key);
    if (!it) { it = { key, grade: g, sem, table, lesson, title: lessonTitle(g, sem, table, lesson), items: [], pick: [] }; cart.push(it); }
    if (!it.items.includes(word)) it.items.push(word);
    if (!Array.isArray(it.pick)) it.pick = it.items.slice();
    if (!it.pick.includes(word)) it.pick.push(word);
    Store.setCart(cart); updateCartBadge(); toast('已加入：' + word);
  }

  // ---------- 多娃切换 ----------

    const box = document.getElementById('kidSwitch'); if (!box) return;
    const kids = Store.getKids(); const cur = Store.getCurKid();
    let h = '';
    kids.forEach(k => h += '<button class="kid-pill ' + (k.id === cur ? 'active' : '') + '" data-kid="' + k.id + '">' + esc(k.name) + '<span class="kid-edit" data-kid-edit="' + k.id + '" aria-label="改名">✎</span></button>');
    h += '<button class="kid-pill add" data-kid-add="1" aria-label="新增孩子">＋</button>';
    box.innerHTML = h;
    box.querySelectorAll('.kid-pill').forEach(b => {
      if (b.dataset.kid) b.onclick = () => switchKid(b.dataset.kid);
      else if (b.dataset.kidAdd) b.onclick = addKid;
    });
    box.querySelectorAll('.kid-edit').forEach(b => {
      b.onclick = (e) => { e.stopPropagation(); renameKid(b.dataset.kidEdit); };
    });

  function switchKid(id) {
    if (id === Store.getCurKid()) return;
    Store.setCurKid(id);
    Store.clearCart(); updateCartBadge();
    recomputeWrongLib();
    renderKidSwitch();
    show(state.tab);
    toast('已切换到「' + (Store.getKids().find(k => k.id === id) || {}).name + '」');

  function addKid() {
    const name = prompt('新孩子的名字：', '孩子' + (Store.getKids().length + 1));
    if (!name) return;
    const kids = Store.getKids();
    const id = 'k' + Date.now();
    kids.push({ id, name: name.trim() });
    Store.setKids(kids); Store.setCurKid(id);
    Store.clearCart(); updateCartBadge();
    recomputeWrongLib();
    renderKidSwitch();
    show(state.tab);
    toast('已添加并切换到「' + name.trim() + '」');
  }
  function renameKid(id) {
    const kids = Store.getKids();
    const k = kids.find(x => x.id === id); if (!k) return;
    const name = prompt('修改孩子名字：', k.name);
    if (name === null) return;
    const n = name.trim();
    if (!n) { toast('名字不能为空'); return; }
    if (n === k.name) return;
    k.name = n; Store.setKids(kids);
    renderKidSwitch();
    if (id === Store.getCurKid()) show(state.tab);
    toast('已改名为「' + n + '」');
  }

  function openTableSheet(g, sem, onlyTable) {
    const sheet = document.getElementById('sheet');

      const ls = getTable(g, sem, onlyTable);
      if (!ls.length) { toast(CN[g] + '年级' + sem + '册 · ' + onlyTable + ' 暂无内容'); return; }
    }
    let html = '<div class="sheet-head">' + CN[g] + '年级' + sem + '册' + (onlyTable ? ' · ' + onlyTable : '') + '<button class="x" id="tblClose">×</button></div>';
    html += '<div class="tbl-sheet-body">';
    let any = false;
    TABLES.forEach(table => {
      if (onlyTable && table !== onlyTable) return;
      const lessons = getTable(g, sem, table);
      if (!lessons.length) return;
      any = true;
      html += '<div class="tbl-block">';
      html += '<div class="tbl-head" style="background:' + TABLE_COLOR[table] + '">' + table + '</div>';
      html += '<div class="tbl-lessons">';

        const mk = metaKey(l._meta);
        state.lessonIndex[mk] = { g, sem, table, label: l.lesson, items: l.items.slice() };

        l.items.forEach((it, i) => { html += '<span class="chip" data-g="' + g + '" data-sem="' + sem + '" data-table="' + table + '" data-lesson="' + l.lesson + '" data-idx="' + i + '">' + it + '</span>'; });
        html += '</div>';
        if (l.flag && l.note) html += '<div class="lc-note">' + l.note + '</div>';
        html += '</div>';
      });

      grades.forEach(g => {
        const total = BEIBEI.filter(x => x.grade === g).length;

        const sub = terms.map(t => (t === '上' ? '上册' : '下册') + ' ' + BEIBEI.filter(x => x.grade === g && x.term === t).length + ' 条').join(' · ');

        html += '</div>';

  function enterBeibei(e) {
    // 整篇放在一起：题目 / 作者 / 正文 作为一段段连续可点字，不做分块导航
    const segs = [];
    if (e.title) segs.push({ label: '题目', text: e.title });
    if (e.author && e.author.trim()) segs.push({ label: '作者', text: e.author.trim() });
    e.lines.forEach(ln => segs.push({ label: '正文', text: ln }));
    const chars = [];
    segs.forEach(seg => { for (const ch of seg.text) chars.push({ ch, label: seg.label }); });
    bbei = { entry: e, segs, chars, wrong: {}, reason: {} };
    renderBeibeiPlay();
  }
  function renderBeibeiPlay() {
    const e = bbei.entry;
    const sess = document.getElementById('session');
    sess.dataset.mode = 'beibei';
    let html = '<div class="sess-head"><span>必背默写 · ' + esc(e.title) + '</span><button class="x" id="bbeiClose">×</button></div>';
    html += '<div class="sess-tip">点字标红（写错的）。题目、作者、正文都需默写，最后点「完成批改」。</div>';
    html += '<div class="sess-list" id="bbeiLines">';
    let gi = 0;
    bbei.segs.forEach(seg => {
      html += '<div class="bbei-part">';
      if (seg.label) html += '<div class="bbei-part-label">' + esc(seg.label) + '</div>';
      html += '<div class="bbei-part-chars">';
      for (let ci = 0; ci < seg.text.length; ci++) {
        const ch = seg.text[ci];
        const key = '' + gi;
        const isWrong = bbei.wrong[key];
      const cls = /[\s，。、]/.test(ch) ? 'bbei-ch blank' : 'bbei-ch';
      html += '<span class="' + cls + (isWrong ? ' wrong' : '') + '" data-bk="' + key + '">' + (ch === ' ' ? ' ' : esc(ch)) + '</span>';
        gi++;
      }
      html += '</div></div>';
    });
    html += '</div>';
    html += reasonDockHtml();
    html += '<div class="sess-acts">';
    html += '<button class="btn primary" id="bbeiDone">完成批改</button>';
    html += '</div>';
    sess.innerHTML = html; sess.classList.remove('hidden');
    document.getElementById('bbeiClose').onclick = () => { sess.classList.add('hidden'); bbei = null; };
    document.getElementById('bbeiDone').onclick = finishBeibei;
    document.querySelectorAll('#bbeiLines .bbei-ch').forEach(sp => sp.onclick = () => {
      const k = sp.dataset.bk;
      if (bbei.wrong[k]) { delete bbei.wrong[k]; delete bbei.reason[k]; }
      else bbei.wrong[k] = true;
      sp.classList.toggle('wrong', !!bbei.wrong[k]);
      updateBeibeiReasonDock();
    });
    updateBeibeiReasonDock();
  }
  function updateBeibeiReasonDock() {
    const dock = document.getElementById('reasonDock'); if (!dock) return;
    const listEl = document.getElementById('rdList');
    const keys = Object.keys(bbei.wrong);
    if (!keys.length) { dock.classList.add('hidden'); listEl.innerHTML = ''; return; }
    dock.classList.remove('hidden');
    listEl.innerHTML = keys.map(k => {
      const ch = (bbei.chars[Number(k)] && bbei.chars[Number(k)].ch) || '?';
      return '<div class="rd-row" data-k="' + k + '"><span class="rd-text">' + esc(ch) + '</span><div class="rd-chips">' + reasonChips(bbei.reason[k]) + '</div></div>';
    }).join('');
    listEl.querySelectorAll('.rd-row').forEach(row => {
      const k = row.dataset.k;
      row.querySelectorAll('.rchip').forEach(c => c.onclick = () => {
        const on = bbei.reason[k] === c.dataset.r;
        bbei.reason[k] = on ? null : c.dataset.r;
        row.querySelectorAll('.rchip').forEach(x => x.classList.toggle('on', x.dataset.r === bbei.reason[k]));
      });
    });
  }
  function finishBeibei() {
    const e = bbei.entry;
    const items = [];
    bbei.chars.forEach((c, gi) => {
      const ch = c.ch;
      if (/[\s，。、]/.test(ch)) return;
      const k = '' + gi;
      if (bbei.wrong[k]) items.push({ text: ch, wrong: true, reason: bbei.reason[k] || null });
    });
    if (items.length === 0) {
      toast('没有标红，已记录为全对');
    }
    const ds = fmtDate(new Date());
    const session = { id: Date.now(), date: ds, lessons: [{ grade: '必背', sem: e.term, table: '必背', lesson: e.title, title: '必背·' + e.title, items }] };
    const hist = Store.getHistory(); hist.push(session); Store.setHistory(hist);
    recomputeWrongLib();
    document.getElementById('session').classList.add('hidden');
    bbei = null;
    toast('已保存，错字加入错字库');
    show(state.tab);
  }

  // ---------- 每日听写 ----------
  function sessionLessonsFor(g, sem, table, lesson) {
    const hist = Store.getHistory();
    for (let i = hist.length - 1; i >= 0; i--) {
      const s = hist[i];
      const l = s.lessons.find(x => x.grade === g && x.sem === sem && x.table === table && x.lesson === lesson);
      if (l) return l.items.map(it => it.text);
    }
    return null;
  }
  function addByTitle(g, sem, table, lesson) {
    const texts = sessionLessonsFor(g, sem, table, lesson);
    if (!texts) { toast('未找到该课历史内容'); return; }
    const item = { key: g + '|' + sem + '|' + table + '|' + lesson + '|re', grade: g, sem, table, lesson, title: lessonTitle(g, sem, table, lesson) + '（重听）', items: texts.slice(), pick: texts.slice() };
    const isNew = Store.pushCart(item);
    updateCartBadge(); toast(isNew ? '已加入重听' : '已在购物车');
  }
  function addWrongByTitle(g, sem, table, lesson) {
    const hist = Store.getHistory(); const set = new Set();
    hist.forEach(s => s.lessons.forEach(l => { if (l.grade === g && l.sem === sem && l.table === table && l.lesson === lesson) l.items.forEach(it => { if (it.wrong) set.add(it.text); }); }));
    if (!set.size) { toast('该课无错词'); return; }
    const items = [...set];
    const key = g + '|' + sem + '|' + table + '|' + lesson + '|wrong';
    const cart = Store.getCart(); let it = cart.find(x => x.key === key);
    if (!it) { it = { key, grade: g, sem, table, lesson, title: lessonTitle(g, sem, table, lesson) + '（错词）', items: [], pick: [] }; cart.push(it); }
    items.forEach(w => { if (!it.items.includes(w)) it.items.push(w); });
    it.pick = it.items.slice();
    Store.setCart(cart); updateCartBadge(); toast('已加入错词 ' + items.length + ' 个');
  }

  function recomputeWrongLib() {
    const hist = Store.getHistory();
    const map = {};
    hist.forEach(s => (s.lessons || []).forEach(l => (l.items || []).forEach(it => {
      if (!it.wrong) return;
      const key = it.text + '|' + l.grade + '|' + l.sem + '|' + l.table + '|' + l.lesson;
      if (!map[key]) map[key] = { text: it.text, grade: l.grade, sem: l.sem, table: l.table, lesson: l.lesson, title: l.title, times: 0, lastDate: s.date, reasons: {} };
      map[key].times++;
      if (it.reason) map[key].reasons[it.reason] = (map[key].reasons[it.reason] || 0) + 1;
    })));
    // 取出现最多的错因为代表错因
    Object.values(map).forEach(m => {
      let best = null, bn = 0;
      for (const k in m.reasons) { if (m.reasons[k] > bn) { bn = m.reasons[k]; best = k; } }
      m.reason = best;
    });
    Store.setWrong(Object.values(map));
  }
  // ---------- 复习间隔逻辑（取晚值 / 滚动顺延，间隔 +2 / +6 / +14 / +28 天） ----------
  // 锚点 = 这个错字第一次被写对的那天。四个检查点固定在 锚点+2 / +6 / +14 / +28（保证学完约一个月内的巩固窗口）。
  // 但若某次复习晚了，后续检查点会从「上次实际写对日」顺延对应间隔（取 固定值 与 顺延值 的较晚者），
  // 因此不会因拖延而压缩间隔，也不会一次补复习就"结案"——必须真的四次间隔复习才完成。
  // 从未写对 / 最近一次写错 → 从「出错日的第二天」起重听（今天刚错只进错题本，今天不复习）。
  function attemptsFor(entry) {
    const hist = Store.getHistory();
    const list = [];
    hist.forEach(s => s.lessons.forEach(l => {
      if (l.grade !== entry.grade || l.sem !== entry.sem || l.table !== entry.table || l.lesson !== entry.lesson) return;
      l.items.forEach(it => { if (it.text === entry.text) list.push({ date: s.date, correct: !it.wrong }); });
    }));
    list.sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    return list;
  }
  function addDaysStr(ds, n) { const d = parseDate(ds); d.setDate(d.getDate() + n); return fmtDate(d); }
  function reviewState(entry) {
    const att = attemptsFor(entry);
    if (!att.length) return { due: false, phase: '无记录', anchor: null, milestones: [], satisfied: 0, last: null };
    const last = att[att.length - 1];
    const correctDates = att.filter(a => a.correct).map(a => a.date).sort();
    const today = fmtDate(new Date());
    if (!correctDates.length) {
      // 从未写对：今天刚写错的，今天只是进错题本，明天起才需要重听
      if (today === last.date) return { due: false, phase: '今天新错 · 明天起重听', anchor: null, milestones: [], satisfied: 0, last };
      return { due: true, phase: '待首次写对', anchor: null, milestones: [], satisfied: 0, last };
    }
    if (!last.correct) {
      // 最近一次写错（补救中）：今天刚写错的，今天不算，明天起重听
      if (today === last.date) return { due: false, phase: '今天又错 · 明天起重听', anchor: null, milestones: [], satisfied: 0, last };
      return { due: true, phase: '补救中', anchor: null, milestones: [], satisfied: 0, last };
    }
    const anchor = correctDates[0];
    const offs = [2, 6, 14, 28];   // 固定检查点偏移
    const gaps = [2, 4, 8, 14];    // 相邻检查点间隔（= offs 的差），用于晚了之后的顺延
    const dueDates = [];
    let prevSat = anchor;      // 上一个被满足的检查点实际日期；初始为锚点
    const actual = [];
    for (let k = 0; k < 4; k++) {
      const fixedK = addDaysStr(anchor, offs[k]);
      const rolledK = addDaysStr(prevSat, gaps[k]);
      const dk = fixedK >= rolledK ? fixedK : rolledK;   // max(固定值, 顺延值)
      dueDates.push(dk);
      const sat = correctDates.find(c => c >= dk);
      if (sat) { actual.push(sat); prevSat = sat; }
      else { actual.push(null); prevSat = dk; }
    }
    const satisfied = actual.filter(x => x !== null).length;
    if (satisfied >= 4) return { due: false, phase: '已完成 ✓', anchor, milestones: dueDates, satisfied, last };
    const nextMi = dueDates[satisfied];
    if (today >= nextMi) return { due: true, phase: '第 ' + (satisfied + 1) + ' 次复习', anchor, milestones: dueDates, satisfied, last };
    return { due: false, phase: '间隔中（下次 ' + nextMi.slice(5) + '）', anchor, milestones: dueDates, satisfied, last };
  }

  function paintWrongBook() {
    const body = document.getElementById('wbBody'); if (!body) return;
    const hint = document.getElementById('wbHint');
    let wl = Store.getWrong().slice();
    const q = (state.wbQ || '').toLowerCase();
    if (q) wl = wl.filter(w => (w.text + ' ' + w.title + ' ' + (w.reason || '') + ' ' + w.lesson + ' ' + w.grade + ' ' + w.table).toLowerCase().indexOf(q) >= 0);
    if (!wl.length) {
      body.innerHTML = '';
      if (hint) hint.textContent = Store.getWrong().length ? '没有匹配的错字。' : '';
      return;
    }
    if (hint) hint.textContent = '共 ' + wl.length + ' 个错字' + (q ? '（已筛选）' : '');
    let groups = {};
    if (state.wbGroup === 'cnt') {
      const tiers = [['高频（错 3 次+）', w => w.times >= 3], ['中频（错 2 次）', w => w.times === 2], ['低频（错 1 次）', w => w.times === 1]];
      tiers.forEach(([name, fn]) => { const arr = wl.filter(fn).sort((a, b) => b.times - a.times); if (arr.length) groups[name] = arr; });
    } else if (state.wbGroup === 'reason') {
      const map = {};
      wl.forEach(w => { const r = w.reason || '未标注'; (map[r] = map[r] || []).push(w); });
      Object.keys(map).sort().forEach(r => groups[r] = map[r].sort((a, b) => b.times - a.times));
    } else {
      const map = {};
      wl.forEach(w => { const t = w.table || '其他'; (map[t] = map[t] || []).push(w); });
      const order = ['识字表', '写字表', '词语表', '必背', '自定义', '追溯补充', '其他'];
      Object.keys(map).sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); }).forEach(t => groups[t] = map[t].sort((a, b) => b.times - a.times));
    }
    let html = '';
    Object.keys(groups).forEach(name => {
      const arr = groups[name];
      html += '<div class="wb-group"><div class="wb-ghead">' + esc(name) + ' <span class="wb-gcnt">' + arr.length + '</span></div>';
      arr.forEach(w => {
        const rs = reviewState(w);
        html += '<div class="wb-row">';
        html += '<div class="wb-main"><span class="wb-text">' + esc(w.text) + '</span><span class="wb-times">×' + w.times + '</span>' + (w.reason ? '<span class="wb-reason">' + esc(w.reason) + '</span>' : '') + (rs.due ? '<span class="wb-due">今天复习</span>' : '') + '</div>';
        html += '<div class="wb-sub">' + esc(w.title) + '</div>';
        html += '<div class="wb-acts"><button class="mini" data-act="review" data-text="' + esc(w.text) + '" data-key="' + esc(w.grade + '|' + w.sem + '|' + w.table + '|' + w.lesson) + '">复习</button><button class="mini" data-act="editreason" data-text="' + esc(w.text) + '" data-key="' + esc(w.grade + '|' + w.sem + '|' + w.table + '|' + w.lesson) + '">' + (w.reason ? '改错因' : '✎ 错因') + '</button></div>';
        html += '</div>';
      });
      html += '</div>';
    });
    body.innerHTML = html;
    body.querySelectorAll('[data-act="review"]').forEach(b => b.onclick = () => {
      const w = wl.find(x => wkey(x) === b.dataset.text + '|' + b.dataset.key);
      if (w) addSingleWrong(w);

    body.querySelectorAll('[data-act="editreason"]').forEach(b => b.onclick = () => { openWrongReasonEditor(b.dataset.text, b.dataset.key); });
  }

  // 在错字本中补录 / 修改某条错字的错误原因
  // 错字库由听写历史派生，recomputeWrongLib 会按历史重算原因；所以这里同步写回历史，避免下次重算被覆盖
  function saveWrongReason(text, grade, sem, table, lesson, reason) {
    const wl = Store.getWrong();
    const w = wl.find(x => wkey(x) === [text, grade, sem, table, lesson].join('|'));
    if (w) { w.reason = reason || null; Store.setWrong(wl); }
    const hist = Store.getHistory();
    let changed = false;
    hist.forEach(s => (s.lessons || []).forEach(l => {
      if (l.grade !== grade || l.sem !== sem || l.table !== table || l.lesson !== lesson) return;
      (l.items || []).forEach(it => { if (it.text === text && it.wrong) { it.reason = reason || null; changed = true; } });
    }));
    if (changed) Store.setHistory(hist);
    paintWrongBook();
  }
  function openWrongReasonEditor(text, key) {
    const parts = key.split('|');
    const grade = parts[0], sem = parts[1], table = parts[2], lesson = parts[3];
    const wl = Store.getWrong();
    const item = wl.find(x => wkey(x) === text + '|' + key);
    const cur = item ? (item.reason || '') : '';
    const customOnly = cur && !REASONS.includes(cur);
    const body = '<div class="fld-hint">为错字「' + esc(text) + '」标注错误原因。可直接选预设，或在下面写自定义原因。</div>' +
      '<div class="rd-chips" id="rbChips" style="margin:4px 0 10px">' + reasonChips((!customOnly && REASONS.includes(cur)) ? cur : null) + '</div>' +
      '<label class="fld">自定义错因（留空则用上面选的预设）<input id="rbCustom" type="text" placeholder="如：把「土」写成「士」、右边写成左边" value="' + esc(customOnly ? cur : '') + '"></label>';
    openModal('标注错因 · ' + text, body, [
      { label: '取消', cls: 'btn ghost', onClick: closeModal },
      { label: '清除', cls: 'btn', onClick: () => { saveWrongReason(text, grade, sem, table, lesson, null); closeModal(); toast('已清除错因'); } },
      { label: '保存', cls: 'btn primary', onClick: () => {
        const custom = (document.getElementById('rbCustom').value || '').trim();
        let sel = null; document.querySelectorAll('#rbChips .rchip.on').forEach(c => sel = c.dataset.r);
        const reason = custom || sel;
        if (!reason) { toast('请选预设或填写自定义错因'); return; }
        saveWrongReason(text, grade, sem, table, lesson, reason);
        closeModal(); toast('已保存错因：' + reason);
      } }
    ]);

      document.querySelectorAll('#rbChips .rchip').forEach(x => x.classList.toggle('on', x === c));
      const ci = document.getElementById('rbCustom'); if (ci) ci.value = '';
    });

  }

  // ---------- 报告页 ----------
  function masteryBar(name, rate, total, wrong) {
    const col = rate >= 90 ? '#7FD8A0' : (rate >= 70 ? '#FFC56E' : '#FF7A8A');
    return '<div class="mb-row"><span class="mb-name">' + name + '</span>' +
      '<div class="mb-track"><div class="mb-fill" style="width:' + rate.toFixed(1) + '%;background:' + col + '"></div></div>' +
      '<span class="mb-v">' + rate.toFixed(0) + '%</span>' +
      '<span class="mb-cnt">' + (total - wrong) + '/' + total + '</span></div>';
  }
  function trendSvg(days) {
    const W = 320, H = 150, pl = 30, pr = 8, pt = 14, pb = 20;
    const plotW = W - pl - pr, plotH = H - pt - pb;
    const n = days.length;
    const pts = [];
    days.forEach((d, i) => {
      if (d.rate == null) return;
      const x = pl + (n > 1 ? i * plotW / (n - 1) : plotW / 2);
      const y = pt + plotH * (1 - d.rate / 100);
      pts.push({ x, y, d });
    });
    if (!pts.length) return '<div class="rep-empty">该时段暂无听写数据</div>';
    let grid = '';
    [0, 50, 100].forEach(g => {
      const y = pt + plotH * (1 - g / 100);
      grid += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="#EEF1F4" stroke-width="1"/>';
      grid += '<text x="2" y="' + (y + 3) + '" font-size="8" fill="#9aa6ab">' + g + '</text>';
    });
    const linePts = pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const area = 'M' + pts[0].x.toFixed(1) + ',' + (pt + plotH) + ' L' + linePts.replace(/ /g, ' L') + ' L' + pts[pts.length - 1].x.toFixed(1) + ',' + (pt + plotH) + ' Z';
    let dots = '';
    pts.forEach(p => { dots += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3" fill="#FF8C42"/>'; });
    let xlab = '';
    if (n > 0) {
      const first = days[0].ds.slice(5), last = days[n - 1].ds.slice(5);
      xlab = '<text x="' + pl + '" y="' + (H - 6) + '" font-size="8" fill="#9aa6ab">' + first + '</text>' +
        '<text x="' + (W - pr) + '" y="' + (H - 6) + '" font-size="8" fill="#9aa6ab" text-anchor="end">' + last + '</text>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="none" style="display:block">' + grid +
      '<path d="' + area + '" fill="rgba(255,140,66,.12)"/>' +
      '<polyline points="' + linePts + '" fill="none" stroke="#FF8C42" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + xlab + '</svg>';
  }
  function renderStats() {
    const v = document.getElementById('view');
    const periods = [7, 14, 30];
    const labels = { 7: '近7天', 14: '近14天', 30: '近30天' };
    if (!periods.includes(+state.statsPeriod)) state.statsPeriod = 7;
    let html = '<div class="seg">';
    periods.forEach(p => { html += '<button class="seg-btn ' + (String(state.statsPeriod) === String(p) ? 'on' : '') + '" data-p="' + p + '">' + labels[p] + '</button>'; });
    html += '</div>';

    const pNum = +state.statsPeriod;
    const hist = Store.getHistory();
    const today = new Date();
    // 每日正确率序列
    const days = [];
    for (let i = pNum - 1; i >= 0; i--) {
      const d = new Date(today); d.setDate(today.getDate() - i); const ds = fmtDate(d);
      let all = [];
      hist.forEach(s => { if (s.date === ds) s.lessons.forEach(l => l.items.forEach(it => all.push(it))); });
      const t = all.length, w = all.filter(x => x.wrong).length;
      days.push({ ds, total: t, wrong: w, rate: t ? (t - w) / t * 100 : null });
    }
    const totalAll = days.reduce((s, d) => s + d.total, 0);
    const wrongAll = days.reduce((s, d) => s + d.wrong, 0);
    const overallRate = totalAll ? (totalAll - wrongAll) / totalAll * 100 : 0;

    html += '<div class="stat-card"><div class="stat-rate">' + overallRate.toFixed(1) + '%</div><div class="stat-sub">正确率（' + totalAll + ' 词，错 ' + wrongAll + '）</div></div>';
    html += '<div class="rep-card"><div class="rep-title">正确率趋势</div>' + trendSvg(days) + '</div>';

    // 各表掌握度
    const TABLES_M = ['识字表', '写字表', '词语表'];
    const m = {}; TABLES_M.forEach(t => m[t] = { total: 0, wrong: 0 });
    const bbeiAll = { total: 0, wrong: 0 };
    hist.forEach(s => s.lessons.forEach(l => {
      const arr = l.items;
      if (TABLES_M.includes(l.table)) { arr.forEach(it => { m[l.table].total++; if (it.wrong) m[l.table].wrong++; }); }
      else if (l.grade === '必背') { arr.forEach(it => { bbeiAll.total++; if (it.wrong) bbeiAll.wrong++; }); }
    }));
    html += '<div class="rep-card"><div class="rep-title">各表掌握度</div><div class="mastery">';
    TABLES_M.forEach(t => { const o = m[t]; const rate = o.total ? (o.total - o.wrong) / o.total * 100 : 0; html += masteryBar(t, rate, o.total, o.wrong); });
    if (bbeiAll.total) { const rate = (bbeiAll.total - bbeiAll.wrong) / bbeiAll.total * 100; html += masteryBar('必背', rate, bbeiAll.total, bbeiAll.wrong); }
    html += '</div></div>';

    // 最弱课文
    const lesMap = {};
    hist.forEach(s => s.lessons.forEach(l => {
      if (l.grade === '必背') return;
      const key = l.grade + '|' + l.sem + '|' + l.table + '|' + l.lesson;
      if (!lesMap[key]) lesMap[key] = { title: l.title, total: 0, wrong: 0 };
      lesMap[key].total += l.items.length;
      lesMap[key].wrong += l.items.filter(it => it.wrong).length;
    }));
    const weak = Object.values(lesMap).filter(x => x.wrong > 0).map(x => ({ title: x.title, total: x.total, wrong: x.wrong, rate: (x.total - x.wrong) / x.total * 100 })).sort((a, b) => a.rate - b.rate).slice(0, 8);
    html += '<div class="rep-card"><div class="rep-title">最弱课文（正确率最低）</div>';
    if (!weak.length) html += '<div class="rep-empty">暂无出错课文 🎉</div>';
    else {
      html += '<div class="weak-list">';
      weak.forEach(x => { html += '<div class="weak-row"><span class="weak-name">' + esc(x.title) + '</span><span class="weak-rate">' + x.rate.toFixed(0) + '%</span><span class="weak-cnt">错' + x.wrong + '/' + x.total + '</span></div>'; });
      html += '</div>';
    }
    html += '</div>';

    // 常错 TOP
    const wl = Store.getWrong().slice().sort((a, b) => b.times - a.times).slice(0, 10);
    html += '<div class="rep-card"><div class="rep-title">常错 TOP</div>';
    if (!wl.length) html += '<div class="rep-empty">错字库为空</div>';
    else { html += '<div class="chips">'; wl.forEach(w => html += '<span class="chip wrong-chip">' + esc(w.text) + '<small>×' + w.times + '</small></span>'); html += '</div>'; }
    html += '</div>';

    v.innerHTML = html;
    v.querySelectorAll('.seg-btn').forEach(b => b.onclick = () => { state.statsPeriod = b.dataset.p; renderStats(); });
  }
