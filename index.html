  function fileRestore() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { applyRestoreRaw(String(r.result)); };
      r.readAsText(f);
    };
    inp.click();
  }
  function applyRestoreRaw(raw) {
    if (!raw) { toast('请先提供备份内容'); return; }
    let p; try { p = JSON.parse(raw); } catch (e) { toast('内容无法识别，请检查是否完整'); return; }
    if (!p || (!Array.isArray(p.history) && !p.allKids)) { toast('备份格式不正确'); return; }

    // 整机备份（全部孩子）：覆盖写回本机所有孩子数据
    if (p.allKids) {
      if (!confirm('将恢复「全部孩子」完整数据并覆盖本机当前所有孩子的记录，确定继续？')) return;
      Store.setKids(p.kids || Store.getKids());
      Store.setCurKid(p.curKid || Store.getCurKid());
      Store.setAllHistory(p.allHistory || {});
      Store.setWrong(Array.isArray(p.wrong) ? p.wrong : []);
      Store.setCart(Array.isArray(p.cart) ? p.cart : []);
      Store.setPlan(p.plan && typeof p.plan === 'object' ? p.plan : {});
      if (p.cust) Store.importCust(p.cust);
      Store.setCustom(Array.isArray(p.custom) ? p.custom : []);
      Store.setBackedUp(true); markBackedUp();
      recomputeWrongLib();
      closeModal();
      D = Store.getEffectiveData();
      renderKidSwitch();
      show(state.tab);
      toast('已恢复全部孩子数据（' + Store.getKids().length + ' 个孩子）');
      return;
    }

    // 单孩子备份：与当前孩子记录合并
    if (!confirm('恢复会与当前孩子的现有记录合并，确定继续？')) return;
    const cur = Store.getHistory(); const map = {};
    cur.forEach(x => map[x.id] = x); p.history.forEach(x => { if (!map[x.id]) map[x.id] = x; });
    const merged = Object.values(map).sort((a, b) => a.date < b.date ? 1 : -1);
    Store.setHistory(merged);
    if (Array.isArray(p.cart)) Store.setCart(p.cart);
    if (p.plan && typeof p.plan === 'object') Store.setPlan(p.plan);
    if (p.cust) {
      const c = Store.getCust();
      Store.importCust({ lessons: Object.assign({}, c.lessons, p.cust.lessons || {}), deleted: Array.from(new Set([...(c.deleted || []), ...(p.cust.deleted || [])])), added: mergeAdded(c.added, p.cust.added) });
    }
    if (Array.isArray(p.custom)) {
      const cur = Store.getCustom(); const m = {};
      cur.forEach(x => m[x.id] = x); p.custom.forEach(x => m[x.id] = x);
      Store.setCustom(Object.values(m));
    }
    Store.setBackedUp(true); markBackedUp();
    recomputeWrongLib();
    closeModal();
    D = Store.getEffectiveData();
    show(state.tab);
    toast('已恢复并合并 ' + merged.length + ' 条记录');
  }

  // ---------- 每次开启提醒备份 ----------
  function hasAnyData() {
    const ah = Store.getAllHistory();
    const hasHist = Object.keys(ah).some(k => Array.isArray(ah[k]) && ah[k].length);
    return hasHist || Store.getWrong().length > 0 || Store.getCustom().length > 0;
  }
  // 是否有「上次备份之后产生的」新数据
  function needsBackup() {
    if (!hasAnyData()) return false;
    const dv = Store.getDataVer();
    const bv = Store.getBackupVer();
    return bv === null || dv > bv;
  }
  function markBackedUp() { Store.setBackupVer(Store.getDataVer()); }
  function maybeRemindBackup() {
    if (!hasAnyData()) return;
    if (needsBackup()) {
      toast('⚠️ 有新的听写 / 错词数据未备份，记得「三表内容 → 下载文件」保存', 4200);
    }
  }

  // ---------- 购物车弹层 ----------
  function setPick(key, idx, on) {
    const cart = Store.getCart();
    const it = cart.find(x => x.key === key); if (!it) return;
    if (!Array.isArray(it.pick)) it.pick = it.items.slice();
    const set = new Set(it.pick);
    const w = it.items[idx];
    if (on) set.add(w); else set.delete(w);
    it.pick = [...set];
    Store.setCart(cart);
  }

        html += '<div class="cart-item">';
        html += '<div class="ci-head"><span class="ci-title' + (open ? ' open' : '') + '" data-edit="' + it.key + '">' + (open ? '▾ ' : '▸ ') + esc(it.title) + '</span><button class="x sm" data-key="' + it.key + '">×</button></div>';
        html += '<div class="ci-items">已选 <b>' + picks.size + '</b>/' + all.length + ' 个：' + all.filter(w => picks.has(w)).map(t => '<span class="ci-word">' + esc(t) + '</span>').join('') + '</div>';

        html += '</div>';
        html += '<div class="ci-edit-acts"><button class="mini" data-edit-all="' + it.key + '">全选</button><button class="mini" data-edit-none="' + it.key + '">全不选</button></div>';
        html += '</div>';
        html += '</div>';

      html += '</div>';
      html += '<div class="sheet-acts"><button class="btn ghost" id="cartClear">清空</button><button class="btn primary" id="cartStart">确认听写</button></div>';
    }

    const c = document.getElementById('cartClose'); if (c) c.onclick = closeSheet;
    sheet.querySelectorAll('.x.sm').forEach(b => b.onclick = () => { Store.removeCart(b.dataset.key); state.cartEdit.delete(b.dataset.key); openCart(); updateCartBadge(); });
    sheet.querySelectorAll('.ci-title').forEach(t => t.onclick = () => {
      const key = t.dataset.edit;
      if (state.cartEdit.has(key)) state.cartEdit.delete(key); else state.cartEdit.add(key);
      openCart();
    });
    sheet.querySelectorAll('.ci-pick').forEach(b => b.onclick = () => {
      const key = b.dataset.key, idx = +b.dataset.idx;
      setPick(key, idx, !b.classList.contains('on'));
      openCart(); updateCartBadge();
    });
    sheet.querySelectorAll('[data-edit-all]').forEach(b => b.onclick = () => {
      const key = b.dataset.editAll; const cart2 = Store.getCart();
      const it = cart2.find(x => x.key === key); if (it) { it.pick = it.items.slice(); Store.setCart(cart2); openCart(); updateCartBadge(); }

      const key = b.dataset.editNone; const cart2 = Store.getCart();
      const it = cart2.find(x => x.key === key); if (it) { it.pick = []; Store.setCart(cart2); openCart(); updateCartBadge(); }
    });
    const cl = document.getElementById('cartClear'); if (cl) cl.onclick = () => { Store.clearCart(); state.cartEdit.clear(); openCart(); updateCartBadge(); };

  }
  function closeSheet() {

  // ---------- 语音播报（可选辅助，不替代家长口报） ----------
  const TTS_OK = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  let VOICES = [];
  function getVoiceRate() { const v = parseFloat(localStorage.getItem('dict.voice.rate')); return isNaN(v) ? 0.95 : v; }
  function setVoiceRate(v) { localStorage.setItem('dict.voice.rate', String(v)); }
  function getVoiceName() { return localStorage.getItem('dict.voice.name') || ''; }
  function setVoiceName(n) { if (n) localStorage.setItem('dict.voice.name', n); else localStorage.removeItem('dict.voice.name'); }
  function getZuciOn() { return localStorage.getItem('dict.voice.zuci') !== '0'; }
  function setZuciOn(on) { localStorage.setItem('dict.voice.zuci', on ? '1' : '0'); }
  function initVoices() {
    if (!TTS_OK) return;
    const load = () => {
      VOICES = window.speechSynthesis.getVoices() || [];
      const sel = document.getElementById('voiceSel');
      if (sel) fillVoiceSelect(sel);
    };
    load();
    window.speechSynthesis.onvoiceschanged = load;
  }
  function fillVoiceSelect(sel) {
    const zh = VOICES.filter(v => /^zh/i.test(v.lang) || /chinese|中文|普通话|国语|mandarin/i.test(v.name));
    const cur = getVoiceName();
    let html = '<option value="">自动（推荐）</option>';
    zh.forEach(v => { html += '<option value="' + esc(v.name) + '"' + (v.name === cur ? ' selected' : '') + '>' + esc(v.name) + (v.localService ? ' · 本机' : '') + '</option>'; });
    if (!zh.length) html += '<option value="">（本设备无中文嗓音）</option>';
    sel.innerHTML = html;
  }
  function pickVoice() {
    const zh = VOICES.filter(v => /^zh/i.test(v.lang) || /chinese|中文|普通话|国语|mandarin/i.test(v.name));
    if (!zh.length) return null;
    const pref = getVoiceName();
    if (pref) { const p = zh.find(v => v.name === pref); if (p) return p; }
    const prefer = ['Ting-Ting', 'Yaoyao', 'Xiaoxiao', 'Google', 'Huihui', 'Mei-Jia', 'Sin-Ji', 'Yu', 'Kangkang'];
    for (const name of prefer) { const f = zh.find(v => v.name.indexOf(name) >= 0); if (f) return f; }
    const local = zh.find(v => v.localService); if (local) return local;
    return zh[0];
  }
  function speakText(text) {
    if (!TTS_OK || !text) return;
    const ss = window.speechSynthesis;
    try { ss.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || 'zh-CN';
    u.rate = getVoiceRate();
    u.pitch = 1;
    ss.speak(u);
    return u;
  }

  let WORD_POOL = null;
  function buildWordPool() {
    if (WORD_POOL) return WORD_POOL;
    const pool = new Set();
    try {
      const eff = Store.getEffectiveData();
      (eff.grades || []).forEach(g => {
        const cw = ((g.tables || {})['词语表']) || [];
        cw.forEach(les => { (les.items || []).forEach(it => { if (it && it.length >= 2 && it.length <= 4) pool.add(it); }); });
      });
    } catch (e) {}
    WORD_POOL = pool;
    return pool;
  }
  function getZuCi(ch) {
    if (ZUCI[ch]) return ZUCI[ch].slice(0, 2);
    if (ZUCI_EXTRA[ch]) return ZUCI_EXTRA[ch].slice(0, 2);
    const pool = buildWordPool();
    const ws = [...pool].filter(w => w.indexOf(ch) >= 0);
    if (!ws.length) return [];
    const shortWs = ws.filter(w => w.length <= 3);
    const cand = shortWs.length >= 2 ? shortWs : ws;
    return cand.slice(0, 2);
  }
  function charSpoken(ch) {
    const ws = getZuCi(ch);
    if (ws.length) return ch + '，' + ws.map(w => w + '的' + ch).join('，');
    return ch;
  }
  function tileSpoken(t) {
    if (t && t.length === 1 && getZuciOn()) return charSpoken(t);
    return t;
  }
  function speakTile(t) {
    speakText(tileSpoken(t));
  }
  // 顺序报听写：逐词朗读两遍 + 间隔，可停止
  let seqSpeaking = false, seqTimer = null, seqTimer2 = null;
  function playSequence(words) {
    if (seqSpeaking) { stopSequence(); return; }
    seqSpeaking = true;
    const btn = document.getElementById('btnSpeak'); if (btn) btn.textContent = '⏹ 停止';
    let idx = 0;
    const clearHi = () => document.querySelectorAll('.sw.speaking').forEach(x => x.classList.remove('speaking'));
    const step = () => {
      if (!seqSpeaking || idx >= words.length) { stopSequence(); return; }
      const w = words[idx];
      clearHi();
      const el = document.getElementById('sw' + idx);
      if (el) el.classList.add('speaking');
      const spoken = tileSpoken(w) || w;
      const oneLen = 900 + spoken.length * 280;          // 一遍时长估计(ms)
      const gap = Math.round(oneLen * 0.5) + 350;         // 两遍之间的短停
      speakTile(w);                                        // 第一遍
      if (seqTimer2) clearTimeout(seqTimer2);
      seqTimer2 = setTimeout(() => {                       // 第二遍
        if (seqSpeaking) speakTile(w);
      }, gap);
      if (seqTimer) clearTimeout(seqTimer);
      seqTimer = setTimeout(() => {                        // 进入下一词
        idx++;
        step();
      }, oneLen + gap + 450);
    };
    step();
  }
  function stopSequence() {
    seqSpeaking = false;
    if (seqTimer) { clearTimeout(seqTimer); seqTimer = null; }
    if (seqTimer2) { clearTimeout(seqTimer2); seqTimer2 = null; }
    if (TTS_OK) try { window.speechSynthesis.cancel(); } catch (e) {}
    document.querySelectorAll('.sw.speaking').forEach(x => x.classList.remove('speaking'));
    const btn = document.getElementById('btnSpeak'); if (btn) btn.textContent = '🔊 顺序报听写';
  }

  // ---------- 听写展示（点字标红；语音为可选辅助） ----------
  function showDictation() {  // 今日听写入口（普通）
    beginDictation(Store.getCart(), false);
  }
  function beginDictation(cartItems, fromReview) {
    if (!cartItems || !cartItems.length) { toast('听写列表为空'); return; }
    if (!fromReview) closeSheet();
    const sess = document.getElementById('session');
    sess.dataset.mode = 'view';
    const ref = [];
    let html = '<div class="sess-head"><span>' + (fromReview ? '复习错字' : '今日听写') + '</span><button class="x" id="sessClose">×</button></div>';
    html += '<div class="sess-tip">点词语可标红（写错的）；完成后存入错词库' + (TTS_OK ? '。📢 想用语音：点词上 🔊 单读，或点「顺序报听写」自动逐词报。' : '') + '</div>';
    html += '<div class="sess-list" id="dictGroups">';
    cartItems.forEach(it => {
      const words = picked(it);
      if (!words.length) return;
      html += '<div class="dict-group"><div class="dg-head">' + esc(it.title) + '</div><div class="dg-items">';
      words.forEach(t => {
        const i = ref.length;
        ref.push({ entry: it, text: t, wrong: false });
        html += '<div class="sw' + (TTS_OK ? ' has-spk' : '') + '" data-i="' + i + '" id="sw' + i + '"><span class="txt">' + t + '</span>' + (TTS_OK ? '<span class="spk" data-spk="' + i + '" aria-label="朗读">🔊</span>' : '') + '</div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    html += reasonDockHtml();
    html += '<div class="sess-acts"><button class="btn ghost" id="btnBack">返回</button>' + (TTS_OK ? '<button class="btn" id="btnSpeak">🔊 顺序报听写</button>' : '') + '<button class="btn primary" id="btnDone">完成</button></div>';
    sess.innerHTML = html; sess.classList.remove('hidden');
    const list = document.getElementById('dictGroups');
    document.getElementById('sessClose').onclick = () => { stopSequence(); sess.classList.add('hidden'); if (fromReview) show(state.tab); };
    document.getElementById('btnBack').onclick = () => { stopSequence(); sess.classList.add('hidden'); if (fromReview) show(state.tab); else openCart(); };
    document.getElementById('btnDone').onclick = () => { stopSequence(); finishSession(ref, fromReview); };
    if (TTS_OK) {
      const spkBtn = document.getElementById('btnSpeak'); if (spkBtn) spkBtn.onclick = () => playSequence(ref.map(r => r.text));
      list.querySelectorAll('.spk').forEach(el => el.onclick = (e) => { e.stopPropagation(); speakTile(ref[+el.dataset.spk].text); });
    }
    list.querySelectorAll('.sw').forEach(el => el.onclick = () => {
      const i = +el.dataset.i; ref[i].wrong = !ref[i].wrong; el.classList.toggle('wrong', ref[i].wrong);
      if (!ref[i].wrong) ref[i].reason = null;
      updateDictReasonDock(ref);
    });
    updateDictReasonDock(ref);
  }
  function updateDictReasonDock(ref) {
    const dock = document.getElementById('reasonDock'); if (!dock) return;
    const listEl = document.getElementById('rdList');
    const wrongs = ref.map((r, i) => ({ i, r })).filter(o => o.r.wrong);
    if (!wrongs.length) { dock.classList.add('hidden'); listEl.innerHTML = ''; return; }
    dock.classList.remove('hidden');
    listEl.innerHTML = wrongs.map(o => '<div class="rd-row" data-i="' + o.i + '"><span class="rd-text">' + esc(o.r.text) + '</span><div class="rd-chips">' + reasonChips(o.r.reason) + '</div></div>').join('');
    listEl.querySelectorAll('.rd-row').forEach(row => {
      const i = +row.dataset.i;
      row.querySelectorAll('.rchip').forEach(c => c.onclick = () => {
        const on = ref[i].reason === c.dataset.r;
        ref[i].reason = on ? null : c.dataset.r;
        row.querySelectorAll('.rchip').forEach(x => x.classList.toggle('on', x.dataset.r === ref[i].reason));
      });
    });
  }
  function finishSession(ref, fromReview) {
    const groups = {};
    ref.forEach(r => { const k = r.entry.key; (groups[k] = groups[k] || { entry: r.entry, items: [] }).items.push({ text: r.text, wrong: r.wrong, reason: r.wrong ? r.reason : null }); });
    const lessons = Object.values(groups).map(g => ({ grade: g.entry.grade, sem: g.entry.sem, table: g.entry.table, lesson: g.entry.lesson, title: g.entry.title, items: g.items }));
    const ds = fmtDate(new Date());
    const session = { id: Date.now(), date: ds, lessons };
    const hist = Store.getHistory(); hist.push(session); Store.setHistory(hist);
    Store.incData();
    recomputeWrongLib();
    const plan = Store.getPlan(); const ld = plan.lastDictated || {};
    lessons.forEach(l => { ld[l.grade + '|' + l.sem + '|' + l.table] = l.lesson; });
    plan.lastDictated = ld; Store.setPlan(plan);
    if (!fromReview) { Store.clearCart(); updateCartBadge(); }
    document.getElementById('session').classList.add('hidden');
    toast(needsBackup() ? '已保存 · 记得「三表内容→下载文件」备份' : '已保存，错词加入错词库');
    show(state.tab);
  }

  // ---------- 听写模式选择 ----------
  function pinyinOf(text) {
    try {
      if (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function') {
        const r = window.pinyinPro.pinyin(text, { toneType: 'symbol' });
        if (r && r.trim()) return r.trim();
      }
    } catch (e) {}
    return text;
  }
  function chooseDictationMode() {
    const sheet = document.getElementById('sheet');
    const cart = Store.getCart();
    const n = cart.reduce((s, x) => s + picked(x).length, 0);
    let html = '<div class="sheet-head">选择听写方式<button class="x" id="modeClose">×</button></div>';
    html += '<div class="hint" style="margin:4px 0 10px">共 <b>' + n + '</b> 个待听写内容。</div>';
    html += '<div class="mode-cards">';
    html += '<button class="mode-card" id="modeParent"><div class="mc-ico">👨‍👩‍👧</div><div class="mc-title">家长报听</div><div class="mc-desc">显示字词，家长口报、点字标红判错（当前默认方式）。</div></button>';
    html += '<button class="mode-card" id="modeSys"><div class="mc-ico">🤖</div><div class="mc-title">系统报听</div><div class="mc-desc">显示拼音、系统朗读，10 秒后自动下一个；孩子写完可自己按「下一个」。</div></button>';
    html += '</div>';
    sheet.innerHTML = html; sheet.classList.remove('hidden'); document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('modeClose').onclick = closeSheet;
    document.getElementById('modeParent').onclick = () => { closeSheet(); beginDictation(cart, false); };
    document.getElementById('modeSys').onclick = () => { closeSheet(); beginSystemDictation(cart); };
  }

  // ---------- 系统报听（显示拼音、系统朗读、10秒间隔、可手动下一个） ----------
  let sys = null;
  function beginSystemDictation(cartItems) {
    if (!cartItems || !cartItems.length) { toast('听写列表为空'); return; }
    closeSheet();
    const ref = [];
    cartItems.forEach(it => { picked(it).forEach(t => ref.push({ entry: it, text: t, wrong: false, reason: null })); });
    if (!ref.length) { toast('没有可听写的内容'); return; }
    sys = { ref, idx: 0, total: ref.length, timer: null };
    renderSysPlayer();
  }
  function stopSys() {
    if (sys && sys.timer) { clearInterval(sys.timer); sys.timer = null; }
    if (TTS_OK) try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  function sysAdvance() {
    stopSys();
    if (sys.idx >= sys.total - 1) { renderSysReview(); return; }
    sys.idx++;
    renderSysPlayer();
  }
  function renderSysPlayer() {
    const sess = document.getElementById('session');
    sess.dataset.mode = 'sysplay';
    const item = sys.ref[sys.idx];
    const py = pinyinOf(item.text);
    const len = [...item.text].length;
    const masks = '＿'.repeat(len);
    const isLast = sys.idx === sys.total - 1;
    let html = '<div class="sys-head"><span>系统报听写 · 第 ' + (sys.idx + 1) + ' / ' + sys.total + '</span><button class="x" id="sysExit">×</button></div>';
    html += '<div class="sys-body">';
    html += '  <div class="sys-py">' + esc(py) + '</div>';
    html += '  <div class="sys-mask">' + esc(masks) + '</div>';
    html += '</div>';
    html += '<div class="sys-foot">';
    html += '  <button class="btn ghost" id="sysReplay">🔊 再听一次</button>';
    html += '  <button class="btn primary" id="sysNext">' + (isLast ? '完成 ✅' : '下一个 ➤') + '</button>';
    html += '</div>';
    html += '<div class="sys-tip">' + (TTS_OK ? '系统已朗读本词（' + (item.text.length === 1 ? '含组词消歧' : '逐词朗读') + '）；孩子写完按「下一个」，或等 <span id="sysCount">10</span> 秒自动进入下一个。' : '⚠️ 本设备无语音朗读，请家长照拼音口报；孩子写完按「下一个」，或等 <span id="sysCount">10</span> 秒自动下一个。') + '</div>';
    sess.innerHTML = html; sess.classList.remove('hidden');
    if (TTS_OK) speakTile(item.text);
    if (sys.timer) clearInterval(sys.timer);
    let left = 10;
    const cnt = document.getElementById('sysCount');
    if (cnt) cnt.textContent = left;
    sys.timer = setInterval(() => {
      left--;
      if (cnt) cnt.textContent = Math.max(left, 0);
      if (left <= 0) { sysAdvance(); }
    }, 1000);
    document.getElementById('sysExit').onclick = () => { stopSys(); sess.classList.add('hidden'); openCart(); };
    document.getElementById('sysReplay').onclick = () => { if (TTS_OK) speakTile(item.text); };
    document.getElementById('sysNext').onclick = () => { sysAdvance(); };
  }
  function renderSysReview() {
    const sess = document.getElementById('session');
    sess.dataset.mode = 'sysreview';
    stopSys();
    const groups = {};
    sys.ref.forEach((r, i) => { const k = r.entry.key; (groups[k] = groups[k] || { entry: r.entry, items: [] }).items.push({ i, text: r.text }); });
    let html = '<div class="sess-head"><span>系统报听写 · 判错</span><button class="x" id="sysRevExit">×</button></div>';
    html += '<div class="sess-tip">系统已报完全部词。请对照孩子的纸，点标红写错的字，完成后存入错词库。</div>';
    html += '<div class="sess-list" id="sysRevList">';
    Object.values(groups).forEach(g => {
      html += '<div class="dict-group"><div class="dg-head">' + esc(g.entry.title) + '</div><div class="dg-items">';
      g.items.forEach(o => { html += '<div class="sw" data-i="' + o.i + '" id="sw' + o.i + '"><span class="txt">' + esc(o.text) + '</span></div>'; });
      html += '</div></div>';
    });
    html += '</div>';
    html += reasonDockHtml();
    html += '<div class="sess-acts"><button class="btn ghost" id="sysRevBack">返回</button><button class="btn primary" id="sysRevDone">完成</button></div>';
    sess.innerHTML = html; sess.classList.remove('hidden');
    document.getElementById('sysRevExit').onclick = () => { sess.classList.add('hidden'); openCart(); };
    document.getElementById('sysRevBack').onclick = () => { sess.classList.add('hidden'); openCart(); };
    document.getElementById('sysRevDone').onclick = () => { stopSys(); finishSession(sys.ref, false); };
    const list = document.getElementById('sysRevList');
    list.querySelectorAll('.sw').forEach(el => el.onclick = () => {
      const i = +el.dataset.i; sys.ref[i].wrong = !sys.ref[i].wrong; el.classList.toggle('wrong', sys.ref[i].wrong);
      if (!sys.ref[i].wrong) sys.ref[i].reason = null;
      updateDictReasonDock(sys.ref);
    });
    updateDictReasonDock(sys.ref);
  }

  function nextLessonOf(g, sem, table, lesson) {
    const lessons = getTable(g, sem, table).map(l => l.lesson);
    const idx = lessons.indexOf(lesson);
    if (idx >= 0 && idx < lessons.length - 1) return { g, sem, table, lesson: lessons[idx + 1] };
    return null;
  }
  function show(tab) {
    state.tab = tab; Store.setLastTab(tab);
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    if (tab === 'tables') renderTables();
    else if (tab === 'daily') renderDaily();
    else if (tab === 'wrong') renderWrongBook();
    else if (tab === 'review') renderReview();
    else if (tab === 'beibei') { bbeiNav = null; renderBeibei(); }
    else if (tab === 'pinyin') renderPinyinWrite();
    else if (tab === 'custom') renderCustom();
    else renderStats();
  }

  function enablePressFx() {
    const SEL = 'button, .chip, .sw, .gb-t, .box, .mini, .cart-fab, .lc-add, .tab, .bar-fill, .cal-cell, .bbei-ch, .kid-pill';
    document.addEventListener('pointerdown', (e) => {
      const el = e.target.closest(SEL);
      if (el && !el.classList.contains('gb-t-empty')) el.classList.add('pressing');
    }, { passive: true });
    const clear = () => { document.querySelectorAll('.pressing').forEach(x => x.classList.remove('pressing')); };
    ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, clear, { passive: true }));
  }

  function migrateLessonNames() {
    const MAP = { '识': '识字', '拼': '汉语拼音', '阅': '阅读', '园': '语文园地', '写': '写字', '词': '词语' };
    const fix = s => {
      if (typeof s !== 'string') return s;
      const m = s.match(/^([识拼阅园写词])([0-9零一二三四五六七八九十]+)$/);
      return m ? (MAP[m[1]] + m[2]) : s;
    };
    let h = Store.getHistory() || [], ch = false;
    h.forEach(r => { if (r && r.lesson != null) { const n = fix(r.lesson); if (n !== r.lesson) { r.lesson = n; ch = true; } } });
    if (ch) Store.setHistory(h);
  }

  // 本地离线（file://）下部分浏览器会禁用 localStorage，静默失败会导致数据丢失。
  // Store 内部已 try/catch 兜底不会崩，这里额外检测并在不可用时给出可见告警。
  function storageOK() {
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; }
  }
  function warnNoStorage() {
    if (document.getElementById('noStoreWarn')) return;
    const el = document.createElement('div');
    el.id = 'noStoreWarn';
    el.className = 'bak-warn';
    el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;margin:0;border-radius:0;padding:10px 12px;font-size:13px;line-height:1.6';
    el.innerHTML = '⚠️ <b>本地存储不可用</b>：当前环境禁止保存数据，退出后会清空。请改用 Chrome / Safari 打开本文件；若仍不行，每次用完点「三表内容 → 下载文件」备份。';
    document.body.appendChild(el);
  }

  function init() {
    enablePressFx();
    initVoices();
    migrateLessonNames();
    recomputeWrongLib();
    document.querySelectorAll('.tab').forEach(t => t.onclick = () => show(t.dataset.tab));
    document.getElementById('cartFab').onclick = openCart;
    document.getElementById('overlay').onclick = closeSheet;
    document.getElementById('calOverlay').onclick = closeCal;
    document.getElementById('modalMask').addEventListener('click', (e) => { if (e.target.id === 'modalMask') closeModal(); });
    updateCartBadge();
    renderKidSwitch();
    show(Store.getLastTab());
    maybeRemindBackup();
    if (!storageOK()) warnNoStorage();
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
  }
  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
